<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спираль Фибоначчи — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const PHI = (1 + Math.sqrt(5)) / 2;
const FIB = [1, 1];
while (FIB.length < 40) FIB.push(FIB[FIB.length - 1] + FIB[FIB.length - 2]);

// Квадраты прикладываются по кругу: вправо, вниз, влево, вверх.
// Дуга i-го квадрата: центр (x + cx·f, y + cy·f), углы [a0, a1] — стыкуются без изломов.
const PI = Math.PI;
const ARC = [[1, 1, PI, 3 * PI / 2], [0, 1, 3 * PI / 2, 2 * PI], [0, 0, 0, PI / 2], [1, 0, PI / 2, PI]];
function squares(n) {
  const sq = [{ x: 0, y: 0, f: 1 }];
  let left = 0, top = 0, right = 1, bottom = 1;
  if (n > 1) { sq.push({ x: 1, y: 0, f: 1 }); right = 2; }
  for (let i = 2; i < n; i++) {
    const f = FIB[i], dir = i % 4;
    let x, y;
    if (dir === 2) { x = left; y = bottom; bottom += f; }
    else if (dir === 3) { x = left - f; y = top; left -= f; }
    else if (dir === 0) { x = left; y = top - f; top -= f; }
    else { x = right; y = top; right += f; }
    sq.push({ x, y, f });
  }
  // габариты после каждого шага — для камеры
  const boxes = [];
  let b = { l: 0, t: 0, r: 0, b: 0 };
  sq.forEach((s, i) => {
    b = i === 0 ? { l: s.x, t: s.y, r: s.x + s.f, b: s.y + s.f } : { l: Math.min(b.l, s.x), t: Math.min(b.t, s.y), r: Math.max(b.r, s.x + s.f), b: Math.max(b.b, s.y + s.f) };
    boxes.push(b);
  });
  return { sq, boxes };
}
const fmtBig = v => fmt(v, 0);

Lab.model({
  id: 'fibonacci',
  unit: 'Квадрат',
  rate: .85,
  labels: { problem: 'Правило', solution: 'Закономерности', terms: 'Числа Фибоначчи' },
  params: [
    { key: 'N', sym: 'n', label: 'сколько квадратов', min: 2, max: 30, value: 12 },
  ],
  compute: p => squares(p.N),
  duration: p => p.N,

  problem: (p, m, v) => `Каждое число Фибоначчи равно сумме двух предыдущих: 1, 1, 2, 3, 5, 8, 13, … Построим квадраты с такими сторонами, прикладывая каждый новый к уже построенному прямоугольнику, и впишем в каждый четверть окружности.
    <span class="q">Что получится из ${v('N')} ${Lab.plural(p.N, 'квадрата', 'квадратов', 'квадратов')} и к чему стремится отношение соседних чисел?</span>`,
  solutionOptions: { reveal: false },
  solution: p => ({
    steps: [
      { t: 'Рекуррентное правило', f: F('F_n = F_{n-1} + F_{n-2},\\quad F_1 = F_2 = 1'), always: true },
      { t: 'Прямоугольник из квадратов — почти «золотой»', f: F(`\\frac{F_{${p.N + 1}}}{F_{${p.N}}} = \\frac{${fmtBig(FIB[p.N])}}{${fmtBig(FIB[p.N - 1])}} \\approx ${fmt(FIB[p.N] / FIB[p.N - 1], 6)}`), always: true },
      { t: 'Золотое сечение', f: F('\\phi = \\frac{1 + \\sqrt{5}}{2} \\approx 1,6180339887'), c: F('\\phi^2 = \\phi + 1,\\quad \\frac{1}{\\phi} = \\phi - 1'), always: true },
      { t: 'Формула Бине — без рекурсии', f: F('F_n = \\frac{\\phi^n - \\psi^n}{\\sqrt{5}},\\quad \\psi = \\frac{1 - \\sqrt{5}}{2}'), c: F(`F_{${p.N}} = ${fmtBig(Math.round((Math.pow(PHI, p.N) - Math.pow(1 - PHI, p.N)) / Math.sqrt(5)))}`), always: true },
    ],
  }),
  terms: p => ({
    items: FIB.slice(0, p.N).map((f, i) => ({ i: 'F' + Lab.sub(i + 1), x: fmtBig(f) })),
    max: 30,
  }),
  cards: [{
    id: 'ratio', title: 'Отношение соседних → φ', icon: 'spark', at: 'after-solution',
    step(body, t, p) {
      const k = Math.max(2, Math.min(p.N, Math.ceil(t - 1e-9)));
      let rows = '';
      for (let i = Math.max(2, k - 6); i <= k; i++) {
        const r = FIB[i - 1] / FIB[i - 2], err = Math.abs(r - PHI);
        const w = Math.max(2, Math.min(100, 100 * Math.log10(1 + err * 50) / Math.log10(26)));
        rows += `<div class="bar-row" style="grid-template-columns:96px 1fr 84px">
          <span>${F(`\\frac{${fmtBig(FIB[i - 1])}}{${fmtBig(FIB[i - 2])}}`)}</span>
          <div class="track" title="отклонение от φ"><span style="width:${w}%"></span></div>
          <span class="n" style="color:${err < 1e-3 ? 'var(--good)' : 'inherit'}">${fmt(r, 5)}</span></div>`;
      }
      body.innerHTML = `<div class="bars">${rows}</div><p class="note">Полоска — насколько отношение отличается от φ = 1,61803… С каждым шагом ошибка уменьшается примерно в φ² ≈ 2,6 раза, а отношения скачут то выше, то ниже φ.</p>`;
    },
  }],

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    return [
      { k: 'Квадрат', v: String(k), u: `из ${p.N}` },
      { k: 'Сторона', v: k ? fmtBig(FIB[k - 1]) : '—', tone: 'acc' },
      { k: 'Fₙ / Fₙ₋₁', v: k > 1 ? fmt(FIB[k - 1] / FIB[k - 2], 5) : '—' },
    ];
  },
  doneText: p => `${p.N} квадратов — отношение ${fmt(FIB[p.N - 1] / FIB[p.N - 2], 6)} ≈ φ`,
  about: `
    <p class="lead">Последовательность Фибоначчи — один из самых удивительных объектов математики. Отношение соседних чисел стремится к <strong>φ</strong> — золотому сечению, которое тысячелетиями считалось эталоном гармонии.</p>
    <h3>История</h3>
    <p>В 1202 году <strong>Леонардо Пизанский</strong> (Фибоначчи) опубликовал «Книгу абака», где описал задачу о размножении кроликов — её решение и дало знаменитую последовательность. Задолго до него её знали индийские математики, описывая ритмы санскритской поэзии ещё в VI веке.</p>
    <h3>Золотое сечение</h3>
    <div class="box">φ = (1 + √5) / 2 ≈ 1,6180339887…</div>
    <p>У φ уникальные свойства: <strong>φ² = φ + 1</strong> и <strong>1/φ = φ − 1</strong>. Прямоугольник со сторонами 1 : φ называют «золотым»: отрежьте от него квадрат — и снова получится золотой прямоугольник. Именно эту самоподобную конструкцию и строит модель.</p>
    <h3>Как строится спираль</h3>
    <p>Каждый квадрат прикладывается к длинной стороне прямоугольника, а в него вписывается четверть окружности. Дуги стыкуются гладко и складываются в спираль, близкую к логарифмической. Камера плавно отдаляется: каждый новый квадрат примерно в φ раз больше предыдущего.</p>
    <h3>В природе</h3>
    <ul>
      <li>🌻 <strong>Подсолнух:</strong> семена образуют 34 и 55 или 55 и 89 спиралей — соседние числа Фибоначчи.</li>
      <li>🌲 <strong>Шишки:</strong> спирали идут в 8 и 13 направлениях.</li>
      <li>🌸 <strong>Цветы:</strong> число лепестков часто 3, 5, 8, 13, 21.</li>
      <li>🐚 <strong>Раковина наутилуса</strong> и рукава галактик закручены похожими спиралями.</li>
    </ul>
    <h3>Формула Бине</h3>
    <div class="box">F(n) = (φⁿ − ψⁿ) / √5,   ψ = (1 − √5)/2 ≈ −0,618</div>
    <p>Удивительно: в формуле иррациональные числа, а результат всегда целый. Поскольку |ψ| &lt; 1, второе слагаемое быстро исчезает, и <span class="m">F(<i>n</i>)</span> — это просто округлённое <span class="m">φ<sup><i>n</i></sup>/√5</span>.</p>`,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    const bg = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, Math.max(w, h) * .7);
    bg.addColorStop(0, dark ? '#1b1830' : '#fffaf0'); bg.addColorStop(1, dark ? '#0e0d18' : '#f4ecdf');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    const f = k ? t - (k - 1) : 1;
    // камера: плавный переход между габаритами (масштаб — в логарифмах)
    const padTop = 80, pad = 30;
    const view = b => {
      const sc = Math.min((w - pad * 2) / (b.r - b.l), (h - padTop - pad) / (b.b - b.t));
      return { sc, cx: (b.l + b.r) / 2, cy: (b.t + b.b) / 2 };
    };
    const vA = view(m.boxes[Math.max(0, k - 2)]), vB = view(m.boxes[Math.max(0, k - 1)]);
    const e = D.ease.inOut(D.seg(f, 0, .55));
    const sc = Math.exp(D.lerp(Math.log(vA.sc), Math.log(vB.sc), e));
    const ccx = D.lerp(vA.cx, vB.cx, e), ccy = D.lerp(vA.cy, vB.cy, e);
    const X = x => w / 2 + (x - ccx) * sc, Y = y => padTop / 2 + h / 2 + (y - ccy) * sc;

    const pal = dark
      ? ['#3b3570', '#2f4f6f', '#3f5f45', '#6b4f2a', '#5a3550', '#2f5f5f']
      : ['#e4dcff', '#d6ecff', '#dcf3dc', '#ffe8c2', '#fddde8', '#d4f4ef'];
    const strokeC = dark ? 'rgba(255,255,255,.18)' : 'rgba(60,40,10,.18)';
    // квадраты
    for (let i = 0; i < k; i++) {
      const q = m.sq[i];
      const isNew = i === k - 1 && t < p.N + 1;
      const a = isNew ? D.ease.out(D.seg(f, .1, .5)) : 1;
      if (a <= 0) continue;
      const x = X(q.x), y = Y(q.y), sz = q.f * sc;
      ctx.save();
      ctx.globalAlpha = a;
      const grow = isNew ? .7 + .3 * D.ease.back(D.seg(f, .1, .5)) : 1;
      ctx.translate(x + sz / 2, y + sz / 2); ctx.scale(grow, grow);
      D.rr(ctx, -sz / 2, -sz / 2, sz, sz, Math.min(6, sz * .04));
      ctx.fillStyle = pal[i % pal.length]; ctx.fill();
      ctx.strokeStyle = isNew ? C.acc : strokeC; ctx.lineWidth = isNew ? 2.5 : 1.2; ctx.stroke();
      if (sz > 26) D.text(ctx, fmtBig(q.f), 0, 0, { size: Math.min(sz * .28, 64), weight: 800, color: dark ? 'rgba(255,255,255,.55)' : 'rgba(40,30,10,.45)' });
      ctx.restore();
    }
    // спираль
    ctx.lineCap = 'round';
    const drawArc = (i, frac, glow) => {
      const q = m.sq[i], [cxm, cym, a0, a1] = ARC[i % 4];
      const cx = X(q.x + cxm * q.f), cy = Y(q.y + cym * q.f);
      ctx.beginPath(); ctx.arc(cx, cy, q.f * sc, a0, a0 + (a1 - a0) * frac);
      ctx.stroke();
      if (glow && frac > 0 && frac < 1) {
        const a = a0 + (a1 - a0) * frac;
        const ex = cx + Math.cos(a) * q.f * sc, ey = cy + Math.sin(a) * q.f * sc;
        D.glow(ctx, ex, ey, 22, C.acc, .7);
        D.circle(ctx, ex, ey, 4, '#fff');
      }
    };
    ctx.strokeStyle = D.alpha(C.acc, .25); ctx.lineWidth = 10;
    for (let i = 0; i < k; i++) drawArc(i, i === k - 1 ? D.seg(f, .35, 1) : 1);
    ctx.strokeStyle = C.acc; ctx.lineWidth = 3.2;
    for (let i = 0; i < k; i++) drawArc(i, i === k - 1 ? D.seg(f, .35, 1) : 1, i === k - 1);

    if (k === 0) D.text(ctx, 'Нажмите ▶ — начнём с квадрата 1×1', w / 2, h / 2, { size: 15, color: C.ink3 });
    // золотой прямоугольник: отношение сторон
    if (k >= 3) {
      const b = m.boxes[k - 1], bw = b.r - b.l, bh = b.b - b.t;
      const big = Math.max(bw, bh), small = Math.min(bw, bh);
      D.pill(ctx, `${fmtBig(big)} : ${fmtBig(small)} = ${fmt(big / small, 4)}`, w - 16, h - 22, { align: 'right', bg: dark ? '#2a2540' : '#fff', color: C.ink, size: 12.5, shadow: true });
    }
  },
});
</script>
</body>
</html>
