<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Столики в кафе — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const seats = n => (n <= 0 ? 0 : 2 * n + 2);

Lab.model({
  id: 'tables',
  unit: 'Столик',
  rate: 0.75,
  params: [
    { key: 'N', sym: 'n', label: 'столиков в ряду', min: 1, max: 30, value: 6 },
  ],
  compute: p => ({ an: seats(p.N) }),
  duration: p => p.N,

  problem: (p, m, v) => `В кафе квадратные столики ставят в ряд вплотную друг к другу. За одним столиком помещаются 4 человека, за двумя сдвинутыми — 6, за тремя — 8.
    <span class="q">Сколько человек поместится за ${v('N')} ${Lab.plural(p.N, 'сдвинутым столиком', 'сдвинутыми столиками', 'сдвинутыми столиками')}?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Числа мест 4, 6, 8, … — арифметическая прогрессия', f: F('a_1 = 4,\\quad d = 2'), always: true },
      { t: 'Почему каждый столик добавляет 2 места', f: `<span style="font-size:14.5px;color:var(--ink-2)">У нового столика 4 стороны, но 2 из них «склеиваются» с соседним</span>`, c: F('4 - 2 = 2'), always: true },
      { t: 'Формула n-го члена', f: F('a_n = 4 + (n - 1)*2 = 2n + 2'), c: F(`a_{${p.N}} = 2*${p.N} + 2 = \\ans{${m.an}}`), final: true },
    ],
    answer: `${m.an} ${Lab.plural(m.an, 'человек', 'человека', 'человек')}`,
  }),

  terms: p => ({
    items: Array.from({ length: p.N }, (_, i) => ({ i: 'a' + Lab.sub(i + 1), x: seats(i + 1) })),
  }),

  cards: [{
    id: 'pattern', title: 'Закономерность', icon: 'list', at: 'after-solution',
    render: () => '',
    step(body, t, p) {
      const k = Math.min(Math.ceil(t - 1e-9), p.N);
      const from = Math.max(1, Math.min(k - 3, p.N - 6)), to = Math.min(p.N, from + 6);
      let rows = '';
      for (let n = from; n <= to; n++) {
        rows += `<tr class="${n === k ? 'now' : ''}" style="${n > k ? 'opacity:.35' : ''}">
          <td>${n}</td><td><b>${seats(n)}</b></td><td>${n === 1 ? '—' : '+2'}</td><td>${F(`2*${n} + 2`)}</td></tr>`;
      }
      body.innerHTML = `<table class="mini-table"><thead><tr><th>Столиков</th><th>Мест</th><th>Прибавка</th><th>Формула</th></tr></thead><tbody>${rows}</tbody></table>`;
    },
  }],

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    const joined = k > 0 && (t - (k - 1) > .62 || t >= k);
    const n = joined ? k : k - 1;
    return [
      { k: 'Столиков', v: String(Math.max(0, n)), u: `из ${p.N}` },
      { k: 'Мест', v: String(seats(Math.max(0, n))), tone: 'acc' },
      { k: 'Прибавка', v: n > 1 ? '+2' : n === 1 ? '4' : '—' },
    ];
  },
  doneText: (p, m) => `За ${p.N} ${Lab.plural(p.N, 'столиком', 'столиками', 'столиками')} — ${m.an} мест`,
  about: `<p class="lead">Задача о столиках — один из самых наглядных способов увидеть, откуда берётся разность прогрессии.</p>
    <p>Каждый новый столик приносит 4 стороны, но две из них — та, которой он примыкает к ряду, и соседняя сторона предыдущего столика — оказываются внутри. Поэтому мест становится больше ровно на 2.</p>
    <p>Можно рассуждать и иначе: у ряда из <i>n</i> столиков сверху и снизу по <i>n</i> мест, плюс по одному месту на торцах: <span class="m">2<i>n</i> + 2</span>.</p>` + Lab.THEORY.ap,

  draw(ctx, s) {
    const { w, h, t, p, C, time } = s;
    const dark = C.dark;
    // пол
    ctx.fillStyle = dark ? '#1c1f2a' : '#f2e6d3';
    ctx.fillRect(0, 0, w, h);
    const plank = 34;
    for (let y = 0, i = 0; y < h; y += plank, i++) {
      ctx.fillStyle = i % 2 ? (dark ? '#1f2330' : '#efe0c9') : (dark ? '#1c1f2a' : '#f4e9d8');
      ctx.fillRect(0, y, w, plank);
      D.line(ctx, 0, y, w, y, dark ? 'rgba(255,255,255,.04)' : 'rgba(120,80,30,.12)', 1);
      for (let x = (i * 97) % 220; x < w; x += 220) D.line(ctx, x, y, x, y + plank, dark ? 'rgba(255,255,255,.04)' : 'rgba(120,80,30,.12)', 1);
    }
    // ковёр под рядом
    const N = p.N;
    const sz = Math.max(16, Math.min(104, (w - 120) / N, (h - 200) / 2.2));
    const chair = sz * .34;
    const cy = h * .55;

    const k = Math.min(Math.ceil(t - 1e-9), N);
    const f = k > 0 ? t - (k - 1) : 0;
    const arrive = D.ease.out(D.seg(f, 0, .42));
    const join = D.seg(f, .42, .62);
    const shown = k === 0 ? 0 : k - 1 + arrive;
    const rowW = shown * sz;
    const x0 = (w - Math.max(rowW, sz)) / 2;

    D.rr(ctx, x0 - chair * 2.2, cy - sz / 2 - chair * 2.2, Math.max(rowW, sz) + chair * 4.4, sz + chair * 4.4, 18);
    ctx.fillStyle = dark ? 'rgba(255,255,255,.035)' : 'rgba(232,89,12,.06)';
    ctx.fill();

    const tableX = i => x0 + (i - 1) * sz + (i === k ? (1 - arrive) * sz * 2.2 : 0);
    const chairCol = dark ? '#ff8a3d' : '#e8590c';
    const drawChair = (x, y, side, a, sc = 1) => {
      if (a <= 0) return;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(x, y);
      ctx.scale(sc, sc);
      const horiz = side === 'top' || side === 'bottom';
      const cw = horiz ? sz * .62 : chair, ch = horiz ? chair : sz * .62;
      D.shadow(ctx, 6, 'rgba(0,0,0,.18)', 2);
      D.rr(ctx, -cw / 2, -ch / 2, cw, ch, Math.min(cw, ch) * .38);
      ctx.fillStyle = chairCol; ctx.fill();
      D.noShadow(ctx);
      // спинка
      const bx = side === 'left' ? -cw / 2 : side === 'right' ? cw / 2 - cw * .28 : -cw / 2;
      const by = side === 'top' ? -ch / 2 : side === 'bottom' ? ch / 2 - ch * .28 : -ch / 2;
      D.rr(ctx, bx, by, horiz ? cw : cw * .28, horiz ? ch * .28 : ch, 3);
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fill();
      ctx.restore();
    };
    const pop = (i, delay) => (i < k ? 1 : D.ease.back(D.seg(f, .62 + delay, .82 + delay)));

    for (let i = 1; i <= k; i++) {
      const x = tableX(i), a = i === k ? Math.min(1, arrive * 1.6) : 1;
      const isFirst = i === 1;
      // стулья сверху/снизу
      const cA = i === k && !isFirst ? a : (i === k ? D.ease.back(D.seg(f, .1, .5)) : 1);
      drawChair(x + sz / 2, cy - sz / 2 - chair * .75, 'top', isFirst && i === k ? cA : a, isFirst && i === k ? cA : 1);
      drawChair(x + sz / 2, cy + sz / 2 + chair * .75, 'bottom', isFirst && i === k ? cA : a, isFirst && i === k ? cA : 1);
      // торцы
      if (isFirst) drawChair(x - chair * .75, cy, 'left', i === k ? cA : 1, i === k ? cA : 1);
      if (i === k) drawChair(x + sz + chair * .75, cy, 'right', i === 1 ? cA : a, i === 1 ? cA : 1);
      else if (i === k - 1) {
        // правый стул предыдущего столика и левый стул нового исчезают
        const out = 1 - join;
        if (out > 0) {
          ctx.save();
          drawChair(x + sz + chair * .75 - join * chair * .2, cy, 'right', out, 1 - join * .3);
          drawChair(tableX(k) - chair * .75, cy, 'left', out * Math.min(1, arrive * 1.6), 1 - join * .3);
          ctx.restore();
          if (join > 0 && join < 1) D.pill(ctx, '−2', x + sz, cy - sz * .9, { bg: C.bad, color: '#fff', size: 13 });
        }
      }
      // столик
      ctx.save();
      ctx.globalAlpha = a;
      D.shadow(ctx, 12, 'rgba(0,0,0,.2)', 4);
      D.rr(ctx, x + 1, cy - sz / 2, sz - 2, sz, Math.max(4, sz * .1));
      ctx.fillStyle = dark ? '#2f3546' : '#ffffff'; ctx.fill();
      D.noShadow(ctx);
      ctx.lineWidth = 2; ctx.strokeStyle = dark ? '#454d63' : '#e3d2ba'; ctx.stroke();
      // тарелка и бокал
      if (sz > 30) {
        D.circle(ctx, x + sz / 2, cy, sz * .17, dark ? '#3c4357' : '#f4efe7', dark ? '#59627c' : '#e2d6c4', 1.5);
        D.circle(ctx, x + sz / 2 + sz * .26, cy - sz * .22, sz * .06, dark ? '#59627c' : '#d4e7f7');
      }
      D.text(ctx, String(i), x + sz / 2, cy + (sz > 30 ? sz * .32 : 0), { size: Math.max(9, sz * .16), weight: 700, color: dark ? '#7d87a3' : '#b7a284' });
      ctx.restore();
    }
    // новый столик: «+2»
    if (k > 1 && f > .62) {
      const u = D.seg(f, .62, 1);
      D.pill(ctx, '+2 места', tableX(k) + sz / 2, cy - sz / 2 - chair * 2.4 - u * 14, { bg: C.good, color: '#fff', size: 13, shadow: true });
    }
    // итог под рядом
    if (k > 0) {
      const joined = f > .62 || t >= k;
      const n = joined ? k : k - 1;
      if (n > 0) {
        const total = seats(n);
        const yb = cy + sz / 2 + chair * 2.8;
        D.pill(ctx, `${n} ${Lab.plural(n, 'столик', 'столика', 'столиков')} → ${total} мест`, w / 2, Math.min(h - 26, yb + 8), { bg: dark ? '#2b2f3d' : '#ffffff', color: C.ink, size: 15, shadow: true, h: 34 });
      }
    } else {
      D.text(ctx, 'Нажмите ▶, чтобы поставить первый столик', w / 2, cy, { size: 16, weight: 600, color: C.ink3 });
    }
  },
});
</script>
</body>
</html>
