<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прыгающий мяч — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const height = (p, n) => p.h1 / Math.pow(p.q, n - 1);
const thr = p => p.cm / 100;
function answer(p) {
  let n = 1;
  while (height(p, n) >= thr(p) - 1e-12 && n < 60) n++;
  return n;
}
const qText = p => `1/${p.q}`;
const timesWord = q => ({ 2: 'вдвое', 3: 'втрое', 4: 'вчетверо', 5: 'впятеро' }[q] || `в ${q} раз`);

Lab.model({
  id: 'ball',
  unit: 'Прыжок',
  rate: p => .75,
  params: [
    { key: 'h1', sym: 'h_1', label: 'высота первого отскока', min: 1, max: 10, step: .1, value: 5.4, unit: 'м', digits: 1 },
    { key: 'q', sym: 'k', label: 'во сколько раз ниже', min: 2, max: 5, value: 3 },
    { key: 'cm', sym: 'h', label: 'порог высоты', min: 1, max: 50, value: 10, unit: 'см' },
  ],
  random: () => ({ h1: +(2 + Math.random() * 7).toFixed(1), q: 2 + Math.floor(Math.random() * 3), cm: 5 + Math.floor(Math.random() * 20) }),
  compute: p => {
    const n = answer(p);
    let k = n - 1;
    return { n, k, R: p.h1 / thr(p), bn: height(p, n) };
  },
  duration: (p, m) => m.n,

  problem: (p, m, v) => `Мячик отскочил от земли на высоту ${v('h1')}&nbsp;м, а при каждом следующем прыжке поднимается ${v('q', timesWord(p.q))} ниже, чем при предыдущем.
    <span class="q">При каком по счёту прыжке мячик впервые не достигнет высоты ${v('cm')}&nbsp;см?</span>`,

  solution: (p, m) => {
    const lo = Math.pow(p.q, m.k - 1), hi = Math.pow(p.q, m.k);
    return {
      steps: [
        { t: 'Высоты прыжков — геометрическая прогрессия', f: F(`b_1 = ${fmt(p.h1)},\\quad q = \\frac{1}{${p.q}}`), always: true },
        { t: 'Условие: n-й прыжок ниже порога', f: F(`${fmt(p.h1)}*(\\frac{1}{${p.q}})^{n-1} < ${fmt(thr(p))}`), c: F(`${p.q}^{n-1} > \\frac{${fmt(p.h1)}}{${fmt(thr(p))}} = \\hl{${fmt(m.R, 2)}}`) },
        { t: 'Подбираем степень', f: m.k > 0 ? F(`${p.q}^{${m.k - 1}} = ${fmt(lo)} \\le ${fmt(m.R, 2)} < ${fmt(hi)} = ${p.q}^{${m.k}}`) : F('n = 1'),
          c: F(`n - 1 = ${m.k}\\quad\\Rightarrow\\quad n = \\ans{${m.n}}`), final: true },
      ],
      answer: `на ${m.n}-м прыжке`,
    };
  },

  terms: (p, m) => ({
    items: Array.from({ length: m.n }, (_, i) => {
      const hh = height(p, i + 1);
      return { i: 'b' + Lab.sub(i + 1), x: hh >= 1 ? fmt(hh, 2) + ' м' : fmt(hh * 100, 1) + ' см', star: i === m.n - 1 };
    }),
    sum: () => `Каждый следующий член в ${p.q} раза меньше предыдущего: ${F(`q = \\frac{1}{${p.q}}`)}`,
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), m.n);
    const hh = k ? height(p, k) : 0;
    return [
      { k: 'Прыжок', v: String(k) },
      { k: 'Высота', v: k ? (hh >= 1 ? fmt(hh, 2) : fmt(hh * 100, 1)) : '—', u: k ? (hh >= 1 ? 'м' : 'см') : '', tone: k && hh < thr(p) ? 'bad' : 'acc' },
      { k: 'Порог', v: fmt(p.cm), u: 'см' },
    ];
  },
  doneText: (p, m) => `На ${m.n}-м прыжке мяч впервые не достиг ${p.cm} см`,
  about: `<p class="lead">Каждый отскок теряет одну и ту же <em>долю</em> высоты — поэтому высоты образуют геометрическую прогрессию со знаменателем меньше единицы.</p>
    <p>Высоты убывают очень быстро: уже через несколько прыжков их не разглядеть в общем масштабе. Поэтому справа вверху есть <strong>лупа</strong> — она показывает последние прыжки и порог крупно.</p>
    <p>Чтобы решить неравенство <span class="m">b<sub>1</sub>·q<sup><i>n</i>−1</sup> &lt; h</span> без логарифмов, удобно перейти к целым степеням: <span class="m">3<sup><i>n</i>−1</sup> &gt; 54</span>, и подобрать первую степень тройки, которая больше 54.</p>` + Lab.THEORY.gp,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    const groundY = h - 46;
    D.sky(ctx, w, groundY, C, dark ? { top: '#0d1326', bottom: '#202a48' } : { top: '#d6ecff', bottom: '#fff6ea' });
    if (dark) D.stars(ctx, w, groundY * .8, time, 2, 60);
    // площадка
    ctx.fillStyle = dark ? '#3b2a24' : '#e9a16b'; ctx.fillRect(0, groundY, w, h - groundY);
    ctx.fillStyle = dark ? '#4a362e' : '#f0b383'; ctx.fillRect(0, groundY, w, 5);
    for (let x = 0; x < w; x += 60) D.line(ctx, x, groundY + 5, x + 30, h, dark ? 'rgba(255,255,255,.04)' : 'rgba(255,255,255,.18)', 2);

    const left = 70, right = w - 30;
    const top = 110;
    const scaleY = (groundY - top) / p.h1;
    const widths = [];
    for (let n = 1; n <= m.n; n++) widths.push(.35 + .65 * Math.sqrt(height(p, n) / p.h1));
    const tot = widths.reduce((a, b) => a + b, 0);
    const xs = [left];
    widths.forEach(wd => xs.push(xs[xs.length - 1] + wd / tot * (right - left)));

    // ось высот
    D.line(ctx, left - 26, groundY, left - 26, top - 10, C.lineStrong, 1.5);
    D.ticks(p.h1, 5).forEach(v => {
      const y = groundY - v * scaleY;
      D.line(ctx, left - 30, y, left - 22, y, C.ink3, 1.5);
      D.text(ctx, fmt(v), left - 34, y, { size: 11, align: 'right', color: C.ink3 });
    });
    D.text(ctx, 'м', left - 26, top - 22, { size: 11, color: C.ink3 });
    // порог
    const ty = groundY - thr(p) * scaleY;
    D.line(ctx, left - 26, ty, right, ty, C.bad, 1.5, [6, 5]);

    const k = Math.min(Math.ceil(t - 1e-9), m.n);
    const f = k ? t - (k - 1) : 0;
    // пройденные дуги
    const arc = (n, upto, col, lw, dash) => {
      const x0 = xs[n - 1], x1 = xs[n], hh = height(p, n) * scaleY;
      ctx.beginPath();
      for (let i = 0; i <= 40 * upto; i++) {
        const u = i / 40;
        const x = x0 + (x1 - x0) * u, y = groundY - 4 * hh * u * (1 - u);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
    };
    for (let n = 1; n <= k; n++) {
      const upto = n < k ? 1 : f;
      const below = height(p, n) < thr(p) - 1e-12;
      arc(n, upto, D.alpha(below ? C.bad : C.acc, .75), 2.5, [2, 6]);
      if (n < k || f > .5) {
        const px = (xs[n - 1] + xs[n]) / 2, py = groundY - height(p, n) * scaleY;
        const hh = height(p, n);
        const lbl = hh >= 1 ? `${fmt(hh, 2)} м` : `${fmt(hh * 100, 1)} см`;
        if (py < ty - 20 || n === m.n) D.pill(ctx, lbl, px, Math.min(py - 16, ty - 16), { bg: below ? C.bad : (dark ? '#2b2f3d' : '#fff'), color: below ? '#fff' : C.ink, size: 11.5, shadow: true });
        D.line(ctx, px, py, px, groundY, D.alpha(C.ink3, .35), 1, [2, 3]);
      }
    }
    D.pill(ctx, `порог ${fmt(p.cm)} см`, right - 4, ty - 14, { align: 'right', bg: C.bad, color: '#fff', size: 11 });

    // мяч
    let bx = left, by = groundY, squash = 0;
    if (k) {
      const x0 = xs[k - 1], x1 = xs[k], hh = height(p, k) * scaleY;
      bx = x0 + (x1 - x0) * f; by = groundY - 4 * hh * f * (1 - f);
      squash = Math.max(0, 1 - Math.min(f, 1 - f) * 14) * .25;
    }
    const r = Math.max(12, Math.min(20, h / 26));
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(bx, groundY + 2, r * (1.1 - (groundY - by) / (groundY - top) * .6), r * .25, 0, 0, Math.PI * 2); ctx.fill();
    ctx.translate(bx, by - r * (1 - squash));
    ctx.scale(1 + squash, 1 - squash);
    ctx.rotate(bx * .03);
    const g = ctx.createRadialGradient(-r * .35, -r * .35, r * .1, 0, 0, r);
    g.addColorStop(0, '#ffb26b'); g.addColorStop(1, '#e8590c');
    D.circle(ctx, 0, 0, r, g);
    ctx.strokeStyle = '#7a2e05'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
    ctx.beginPath(); ctx.arc(-r * 1.25, 0, r * .9, -.75, .75); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * 1.25, 0, r * .9, Math.PI - .75, Math.PI + .75); ctx.stroke();
    ctx.restore();

    // лупа: последние прыжки в крупном масштабе
    const lw2 = Math.min(250, w * .34), lh = Math.min(150, h * .3);
    const lx = w - lw2 - 14, ly = 84;
    if (w > 520 && k >= 2) {
      const first = Math.max(1, m.n - 3);
      const zoomMax = Math.max(thr(p) * 2.2, height(p, Math.min(first + 1, m.n)) * 1.15);
      ctx.save();
      D.shadow(ctx, 18, 'rgba(0,0,0,.2)', 4);
      D.rr(ctx, lx, ly, lw2, lh, 16); ctx.fillStyle = dark ? '#171c2b' : '#ffffff'; ctx.fill();
      D.noShadow(ctx);
      ctx.lineWidth = 1.5; ctx.strokeStyle = C.line; ctx.stroke();
      ctx.clip();
      const gy = ly + lh - 18, sy = (lh - 44) / zoomMax;
      D.line(ctx, lx, gy, lx + lw2, gy, C.lineStrong, 2);
      const tY = gy - thr(p) * sy;
      D.line(ctx, lx, tY, lx + lw2, tY, C.bad, 1.5, [5, 4]);
      const n0 = first, n1 = m.n;
      for (let n = n0; n <= n1; n++) {
        if (n > k) break;
        const u0 = (n - n0) / (n1 - n0 + 1), u1 = (n - n0 + 1) / (n1 - n0 + 1);
        const x0 = lx + 10 + u0 * (lw2 - 20), x1 = lx + 10 + u1 * (lw2 - 20);
        const hh = Math.min(height(p, n), zoomMax * 1.3) * sy;
        const upto = n < k ? 1 : f;
        const below = height(p, n) < thr(p) - 1e-12;
        ctx.beginPath();
        for (let i = 0; i <= 30 * upto; i++) { const u = i / 30; const x = x0 + (x1 - x0) * u, y = gy - 4 * hh * u * (1 - u); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.strokeStyle = below ? C.bad : C.acc; ctx.lineWidth = 2.5; ctx.stroke();
        if (n < k || f > .5) D.text(ctx, `№${n}`, (x0 + x1) / 2, gy + 10, { size: 10, weight: 700, color: below ? C.bad : C.ink3 });
      }
      ctx.restore();
      D.pill(ctx, '🔍 лупа', lx + 12, ly + 14, { align: 'left', bg: C.acc, color: '#fff', size: 10.5 });
    }
  },
});
</script>
</body>
</html>
