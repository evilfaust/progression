<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Камень в ущелье — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;

const term = (p, k) => p.a1 + (k - 1) * p.d;
const sum = (p, k) => k * (2 * p.a1 + (k - 1) * p.d) / 2;

// Путь к моменту t. При v₀ = a₁ − d/2 ≥ 0 это равноускоренное движение
// s = v₀t + dt²/2: в целые секунды оно совпадает с суммами прогрессии.
function pathAt(p, t) {
  const v0 = p.a1 - p.d / 2;
  if (v0 >= 0) return v0 * t + p.d * t * t / 2;
  const k = Math.floor(t);
  return sum(p, k) + term(p, k + 1) * (t - k);
}

Lab.model({
  id: 'stone',
  unit: 'Секунда',
  rate: 0.8,
  params: [
    { key: 'a1', sym: 'a_1', label: 'за первую секунду', min: 1, max: 60, value: 9, unit: 'м' },
    { key: 'd', sym: 'd', label: 'прибавка каждую секунду', min: 1, max: 30, value: 10, unit: 'м' },
    { key: 'N', sym: 'N', label: 'секунд полёта', min: 1, max: 30, value: 5, unit: 'с' },
  ],
  random: () => ({ a1: 3 + Math.floor(Math.random() * 15), d: 2 + Math.floor(Math.random() * 12), N: 4 + Math.floor(Math.random() * 7) }),
  compute: p => ({ an: term(p, p.N), S: sum(p, p.N) }),
  duration: p => p.N,

  problem: (p, m, v) => `Камень падает в ущелье. За первую секунду он пролетает ${v('a1')}&nbsp;м, а за каждую следующую — на ${v('d')}&nbsp;м больше, чем за предыдущую.
    <span class="q">Какое расстояние камень пролетит за ${v('N')}&nbsp;${Lab.plural(p.N, 'секунду', 'секунды', 'секунд')}?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Пути за каждую секунду — арифметическая прогрессия', f: F(`a_1 = ${fmt(p.a1)},\\quad d = ${fmt(p.d)}`), always: true },
      { t: `Путь за ${p.N}-ю секунду`, f: F('a_n = a_1 + (n - 1)*d'), c: F(`a_{${p.N}} = ${fmt(p.a1)} + ${p.N - 1}*${fmt(p.d)} = \\hl{${fmt(m.an)}}`) },
      { t: 'Сумма первых N членов', f: F('S_n = \\frac{a_1 + a_n}{2}*n'), c: F(`S_{${p.N}} = \\frac{${fmt(p.a1)} + ${fmt(m.an)}}{2}*${p.N} = \\ans{${fmt(m.S)}}`), final: true },
    ],
    answer: `${fmt(m.S)} м`,
  }),

  terms: (p, m) => ({
    items: Array.from({ length: p.N }, (_, i) => ({ i: 'a' + Lab.sub(i + 1), x: fmt(term(p, i + 1)) })),
    sum: t => {
      const k = Math.min(Math.floor(t), p.N);
      if (k === 0) return 'Нажмите ▶ — камень полетит, а слагаемые появятся по одному.';
      const parts = Array.from({ length: Math.min(k, 6) }, (_, i) => fmt(term(p, i + 1)));
      return F(`S_{${k}} = ${parts.join(' + ')}${k > 6 ? ' + \\ldots' : ''} = ${fmt(sum(p, k))}`);
    },
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    return [
      { k: 'Секунда', v: `${k}`, u: `из ${p.N}` },
      { k: 'Пролетел', v: fmt(pathAt(p, t), 1), u: 'м', tone: 'acc' },
      { k: 'За эту секунду', v: k ? fmt(term(p, k)) : '—', u: k ? 'м' : '' },
    ];
  },
  doneText: (p, m) => `За ${p.N} ${Lab.plural(p.N, 'секунду', 'секунды', 'секунд')} камень пролетел ${fmt(m.S)} м`,
  about: `
    <p class="lead">Падение тела — классический пример арифметической прогрессии: за каждую следующую секунду путь увеличивается на одну и ту же величину.</p>
    <h3>Откуда берётся прогрессия</h3>
    <p>При равноускоренном движении путь растёт как <span class="m">s = v<sub>0</sub>t + <i>at</i><sup>2</sup>/2</span>. Разности путей за соседние секунды одинаковы и равны ускорению: для свободного падения это около 9,8 м за каждую следующую секунду. В задаче для простоты взяты 10 м.</p>
    <p>Модель двигает камень именно по такому закону, поэтому в конце каждой секунды он оказывается ровно на отметке <span class="m">S<sub><i>n</i></sub></span>.</p>
    <h3>Формулы</h3>
    <div class="box">a<sub>n</sub> = a<sub>1</sub> + (n − 1)·d<br>S<sub>n</sub> = (a<sub>1</sub> + a<sub>n</sub>)·n / 2 = (2a<sub>1</sub> + (n − 1)d)·n / 2</div>
    <h3>Идея Гаусса</h3>
    <p>Сложим ряд с самим собой в обратном порядке: <strong>a<sub>1</sub> + a<sub>n</sub> = a<sub>2</sub> + a<sub>n−1</sub> = …</strong> — все пары одинаковы. Пар ровно <i>n</i>, поэтому удвоенная сумма равна <span class="m">(a<sub>1</sub> + a<sub>n</sub>)·n</span>.</p>`,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    const rimY = Math.max(96, h * .2), botY = h - 18;
    const cx = w * .5, gw = Math.max(110, Math.min(w * .3, 260));
    const xl = cx - gw / 2, xr = cx + gw / 2;
    const Smax = Math.max(m.S * 1.07, 1);
    const yOf = d => rimY + (d / Smax) * (botY - rimY);

    // небо
    D.sky(ctx, w, rimY + 10, C, dark ? {} : { top: '#9fd3ff', bottom: '#e6f4ff' });
    if (dark) {
      D.stars(ctx, w, rimY, time, 3, 50);
      D.circle(ctx, w * .82, rimY * .42, 16, '#f4f1de');
      D.circle(ctx, w * .82 + 6, rimY * .42 - 4, 14, '#0f1530');
    } else {
      D.glow(ctx, w * .84, rimY * .38, 60, '#ffd54a', .55);
      D.circle(ctx, w * .84, rimY * .38, 20, '#ffd54a');
      const drift = (time * 8) % (w + 200);
      D.cloud(ctx, (w * .12 + drift) % (w + 200) - 100, rimY * .45, 34, 'rgba(255,255,255,.95)');
      D.cloud(ctx, (w * .55 + drift * .6) % (w + 200) - 100, rimY * .3, 24, 'rgba(255,255,255,.85)');
    }

    // пласты породы — одинаковые по обе стороны ущелья
    const rnd = D.rand(11);
    const bands = [];
    for (let y = rimY, i = 0; y < h + 40; i++) { const bh = 14 + rnd() * 30; bands.push({ y, bh, c: i }); y += bh; }
    const pal = dark ? ['#5e4233', '#4b3427', '#6a4b39', '#3f2c21', '#574032', '#6f5140'] : ['#d4975a', '#bf7f45', '#e2ab6e', '#ad6d3b', '#c98b51', '#e8b77f'];
    const wave = (x, i) => 3 * Math.sin(x * .018 + i * 1.7) + 2 * Math.sin(x * .047 + i);
    const edge = (y, side) => {
      const k = side * 11.3;
      return 10 * Math.sin(y * .031 + k) + 6 * Math.sin(y * .083 + k * 2) + 3 * Math.sin(y * .21 + k);
    };
    const edgeX = (y, side) => (side < 0 ? xl : xr) + edge(y, side);
    const paintStrata = (x0, x1, shade) => {
      bands.forEach((b, i) => {
        ctx.beginPath();
        for (let x = x0; x <= x1 + 8; x += 8) { const y = b.y + wave(x, i); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
        for (let x = x1 + 8; x >= x0; x -= 8) ctx.lineTo(x, b.y + b.bh + wave(x, i + 1) + 1);
        ctx.closePath();
        ctx.fillStyle = shade ? D.mix(pal[b.c % pal.length], dark ? '#000000' : '#3b1d0b', shade) : pal[b.c % pal.length];
        ctx.fill();
      });
    };
    // дальняя стена: те же пласты, но в тени и глубже — темнее
    ctx.save();
    ctx.beginPath(); ctx.rect(xl - 30, rimY, gw + 60, h - rimY); ctx.clip();
    paintStrata(xl - 30, xr + 30, .45);
    const deep = ctx.createLinearGradient(0, rimY, 0, h);
    deep.addColorStop(0, 'rgba(0,0,0,0)'); deep.addColorStop(1, dark ? 'rgba(0,0,0,.55)' : 'rgba(40,15,0,.45)');
    ctx.fillStyle = deep; ctx.fillRect(xl - 30, rimY, gw + 60, h - rimY);
    ctx.restore();
    // ближние стены
    for (const side of [-1, 1]) {
      const x0 = side < 0 ? 0 : w;
      ctx.save();
      ctx.beginPath(); ctx.moveTo(x0, rimY);
      for (let yy = rimY; yy <= h; yy += 4) ctx.lineTo(edgeX(yy, side), yy);
      ctx.lineTo(x0, h); ctx.closePath();
      ctx.clip();
      paintStrata(side < 0 ? 0 : xr - 30, side < 0 ? xl + 30 : w, 0);
      // фактура: крапинки и трещины
      const r2 = D.rand(side < 0 ? 5 : 9);
      for (let i = 0; i < 160; i++) {
        const x = side < 0 ? r2() * (xl + 20) : xr - 20 + r2() * (w - xr + 20), y = rimY + r2() * (h - rimY);
        D.circle(ctx, x, y, r2() * 1.8 + .4, r2() < .5 ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.12)');
      }
      ctx.strokeStyle = dark ? 'rgba(0,0,0,.35)' : 'rgba(90,40,10,.25)'; ctx.lineWidth = 1.2;
      for (let i = 0; i < 7; i++) {
        let x = side < 0 ? r2() * xl : xr + r2() * (w - xr), y = rimY + 20 + r2() * (h - rimY - 40);
        ctx.beginPath(); ctx.moveTo(x, y);
        for (let j = 0; j < 4; j++) { x += (r2() - .5) * 14; y += 6 + r2() * 10; ctx.lineTo(x, y); }
        ctx.stroke();
      }
      // объём: светлая кромка у обрыва
      const sh = ctx.createLinearGradient(side < 0 ? xl - 40 : xr + 40, 0, side < 0 ? xl + 12 : xr - 12, 0);
      sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, side < 0 ? 'rgba(255,240,210,.22)' : 'rgba(0,0,0,.22)');
      ctx.fillStyle = sh; ctx.fillRect(side < 0 ? xl - 40 : xr - 12, rimY, 52, h - rimY);
      ctx.restore();
      ctx.beginPath();
      for (let yy = rimY; yy <= h; yy += 4) yy === rimY ? ctx.moveTo(edgeX(yy, side), yy) : ctx.lineTo(edgeX(yy, side), yy);
      ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 2.5; ctx.stroke();
    }
    // трава с травинками
    for (const side of [-1, 1]) {
      const a = side < 0 ? 0 : edgeX(rimY, 1) - 2, b = side < 0 ? edgeX(rimY, -1) + 2 : w;
      ctx.fillStyle = dark ? '#2b5232' : '#58b45a';
      D.rr(ctx, a - 6, rimY - 9, b - a + 6, 12, 5); ctx.fill();
      ctx.strokeStyle = dark ? '#3c7445' : '#7ccf74'; ctx.lineWidth = 1.6;
      const rg = D.rand(side < 0 ? 21 : 22);
      for (let x = a + 3; x < b - 2; x += 5 + rg() * 5) {
        const sw = Math.sin(time * 1.6 + x * .05) * 1.5;
        ctx.beginPath(); ctx.moveTo(x, rimY - 6); ctx.quadraticCurveTo(x + sw, rimY - 10, x + sw * 1.6, rimY - 13 - rg() * 4); ctx.stroke();
      }
    }

    // линейка слева
    const rx = Math.max(10, xl - 70);
    D.rr(ctx, rx, rimY - 4, 44, botY - rimY + 8, 12);
    ctx.fillStyle = dark ? 'rgba(8,8,16,.42)' : 'rgba(255,250,240,.5)';
    ctx.fill();
    const ticks = D.ticks(Smax, 6);
    ticks.forEach(v => {
      const y = yOf(v);
      if (y > botY + 1) return;
      D.line(ctx, rx + 34, y, rx + 44, y, dark ? 'rgba(255,255,255,.7)' : 'rgba(60,30,10,.65)', 1.5);
      D.text(ctx, fmt(v), rx + 30, y, { size: 11, weight: 650, align: 'right', color: dark ? '#efe6da' : '#4a2a14' });
    });
    D.text(ctx, 'глубина, м', rx + 22, rimY - 18, { size: 11, weight: 600, color: dark ? '#efe6da' : '#4a2a14' });

    // отметки секунд
    const done = Math.min(Math.floor(t + 1e-9), p.N);
    const markC = dark ? '#ffd166' : '#7a3e0c';
    for (let k = 1; k <= done; k++) {
      const y = yOf(sum(p, k)), y0 = yOf(sum(p, k - 1));
      D.line(ctx, xl - 6, y, xr + 6, y, D.alpha(markC, .7), 1.5, [5, 5]);
      D.pill(ctx, `${k} с · ${fmt(sum(p, k))} м`, xr + 16, y, { align: 'left', bg: dark ? '#2a2233' : '#fff', color: dark ? '#ffd166' : '#7a3e0c', size: 11.5, shadow: true });
      if (y - y0 > 22) D.text(ctx, `+${fmt(term(p, k))}`, cx + gw * .26, (y + y0) / 2, { size: 12.5, weight: 700, color: dark ? '#ffe7a8' : '#fff4e0', stroke: 'rgba(0,0,0,.25)', strokeWidth: 3 });
    }

    // камень
    const d = pathAt(p, t);
    const y = yOf(d);
    const r = Math.max(10, Math.min(18, gw * .085));
    for (let i = 6; i >= 1; i--) {
      const tt = Math.max(0, t - i * .035);
      if (tt === t) continue;
      D.circle(ctx, cx, yOf(pathAt(p, tt)), r * (1 - i * .08), D.alpha(dark ? '#ffd166' : '#ffffff', .05 * (7 - i)));
    }
    if (s.playing) for (let i = 0; i < 3; i++) D.line(ctx, cx - r * .6 + i * r * .6, y - r * 1.6, cx - r * .6 + i * r * .6, y - r * 3.2, D.alpha(dark ? '#fff' : '#fff', .35), 1.5);
    ctx.save();
    ctx.translate(cx, y);
    ctx.rotate(d * .06);
    D.shadow(ctx, 14, 'rgba(0,0,0,.35)', 4);
    ctx.beginPath();
    const rs = D.rand(42);
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * Math.PI * 2, rr = r * (.82 + rs() * .3);
      i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    const sg = ctx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r * 1.2);
    sg.addColorStop(0, '#cfc6bb'); sg.addColorStop(.6, '#8d8378'); sg.addColorStop(1, '#5d554d');
    ctx.fillStyle = sg; ctx.fill();
    D.noShadow(ctx);
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
    if (t > 0) D.pill(ctx, `${fmt(d, 1)} м`, cx - r - 10, y, { align: 'right', bg: C.acc, color: '#fff', size: 12, shadow: true });
  },
});
</script>
</body>
</html>
