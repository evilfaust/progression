<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Амфитеатр — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;

Lab.model({
  id: 'amphitheater',
  unit: 'Ряд',
  rate: 1.6,
  params: [
    { key: 'N', sym: 'n', label: 'рядов всего', min: 8, max: 30, value: 14 },
    { key: 'a5', sym: 'a_5', label: 'мест в 5-м ряду', min: 5, max: 60, value: 27 },
    { key: 'a8', sym: 'a_8', label: 'мест в 8-м ряду', value: 36,
      // 8-й ряд длиннее 5-го на 3d, а первый ряд a₅ − 4d должен быть не пустым
      values: p => { const out = []; for (let d = 1; p.a5 - 4 * d >= 1; d++) out.push(p.a5 + 3 * d); return out.length ? out : [p.a5 + 3]; } },
  ],
  random() {
    const d = 1 + Math.floor(Math.random() * 5), a1 = 5 + Math.floor(Math.random() * 20);
    return { N: 10 + Math.floor(Math.random() * 12), a5: a1 + 4 * d, a8: a1 + 7 * d };
  },
  compute(p) {
    const d = (p.a8 - p.a5) / 3, a1 = p.a5 - 4 * d;
    return { d, a1, an: a1 + (p.N - 1) * d, row: k => a1 + (k - 1) * d };
  },
  validate: (p, m) => (m.a1 < 1 ? 'При таких данных в первом ряду не остаётся мест — увеличьте 5-й ряд.' : null),
  duration: p => p.N,

  problem: (p, m, v) => `В амфитеатре ${v('N')} ${Lab.plural(p.N, 'ряд', 'ряда', 'рядов')}. В каждом следующем ряду на одно и то же число мест больше, чем в предыдущем. В пятом ряду ${v('a5')} ${Lab.plural(p.a5, 'место', 'места', 'мест')}, а в восьмом — ${v('a8')}.
    <span class="q">Сколько мест в последнем ряду амфитеатра?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Между 5-м и 8-м рядами три шага по d', f: F('a_8 - a_5 = 3d'), c: F(`d = \\frac{${p.a8} - ${p.a5}}{3} = \\hl{${fmt(m.d)}}`) },
      { t: 'Первый ряд: от пятого назад на 4 шага', f: F('a_1 = a_5 - 4d'), c: F(`a_1 = ${p.a5} - 4*${fmt(m.d)} = \\hl{${fmt(m.a1)}}`) },
      { t: `Последний, ${p.N}-й ряд`, f: F('a_n = a_1 + (n - 1)*d'), c: F(`a_{${p.N}} = ${fmt(m.a1)} + ${p.N - 1}*${fmt(m.d)} = \\ans{${fmt(m.an)}}`), final: true },
    ],
    answer: `${fmt(m.an)} ${Lab.plural(m.an, 'место', 'места', 'мест')}`,
  }),

  terms: (p, m) => ({
    items: Array.from({ length: p.N }, (_, i) => ({ i: 'a' + Lab.sub(i + 1), x: fmt(m.row(i + 1)), mark: i === 4 || i === 7, star: i === p.N - 1 })),
    sum: () => `Рамкой отмечены ряды, которые даны в условии, звёздочкой — искомый.`,
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    return [
      { k: 'Ряд', v: String(k), u: `из ${p.N}` },
      { k: 'Мест в ряду', v: k ? fmt(m.row(k)) : '—', tone: 'acc' },
      { k: 'Шаг d', v: k ? `+${fmt(m.d)}` : '?' },
    ];
  },
  doneText: (p, m) => `В последнем ряду ${fmt(m.an)} ${Lab.plural(m.an, 'место', 'места', 'мест')}`,
  about: `<p class="lead">Здесь прогрессия задана не первым членом, а двумя членами из середины — типичный ход задач ОГЭ.</p>
    <p>Главная идея: от любого члена до любого другого можно дойти шагами по <i>d</i>. От 5-го ряда до 8-го — три шага, поэтому разница мест равна 3<i>d</i>. Дальше от пятого ряда отступаем на четыре шага назад к первому, а от первого — вперёд к последнему.</p>
    <div class="box">a<sub>m</sub> − a<sub>k</sub> = (m − k)·d</div>` + Lab.THEORY.ap,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    const bg = ctx.createRadialGradient(w / 2, h, 10, w / 2, h, Math.max(w, h));
    bg.addColorStop(0, dark ? '#251b38' : '#f6efff');
    bg.addColorStop(1, dark ? '#12101c' : '#ece6f5');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

    const cx = w / 2, cy = h - 34;
    const R = Math.min(w / 2 - 34, h - 110);
    const r0 = Math.max(40, R * .2);
    const step = (R - r0) / p.N;
    const a0 = Math.PI + .1, a1 = Math.PI * 2 - .1;

    // сцена
    D.shadow(ctx, 18, 'rgba(0,0,0,.25)', 4);
    ctx.beginPath(); ctx.arc(cx, cy, r0 * .82, Math.PI, 0); ctx.closePath();
    const sg = ctx.createLinearGradient(0, cy - r0, 0, cy);
    sg.addColorStop(0, dark ? '#6d4bb3' : '#b197fc'); sg.addColorStop(1, dark ? '#4a2f86' : '#8b6cf0');
    ctx.fillStyle = sg; ctx.fill();
    D.noShadow(ctx);
    D.glow(ctx, cx, cy - r0 * .3, r0 * .9, dark ? '#ffd8a8' : '#fff3bf', .35 + .1 * Math.sin(time * 2));
    D.text(ctx, 'СЦЕНА', cx, cy - r0 * .32, { size: Math.max(11, r0 * .2), weight: 800, color: '#fff' });

    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    const f = k ? t - (k - 1) : 0;
    const base = dark ? '#8b5cf6' : '#7c4ddb';
    for (let i = 1; i <= p.N; i++) {
      const r = r0 + (i - .5) * step + 4;
      const count = Math.max(1, Math.round(m.row(i)));
      const given = i === 5 || i === 8, last = i === p.N;
      let col = D.mix(base, dark ? '#e9d8ff' : '#c9b6f2', (i - 1) / Math.max(1, p.N - 1) * .55);
      if (i === 5) col = C.amber;
      if (i === 8) col = C.blue;
      if (last && t >= p.N - 1e-6) col = C.green;
      // дорожка ряда
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1);
      ctx.strokeStyle = dark ? 'rgba(255,255,255,.05)' : 'rgba(80,40,140,.07)';
      ctx.lineWidth = step * .78; ctx.stroke();

      const visibleFrac = i < k ? 1 : i === k ? D.seg(f, 0, .85) : 0;
      const showGiven = given && visibleFrac === 0;
      if (visibleFrac === 0 && !showGiven) continue;
      const span = a1 - a0;
      const spacing = (r * span) / count;
      const seatW = Math.max(1.6, Math.min(spacing * .72, step * .66, 16));
      const seatH = Math.max(1.6, Math.min(step * .58, 14));
      for (let j = 0; j < count; j++) {
        const u = (j + .5) / count;
        let a = 1;
        if (!showGiven && i === k) a = D.clamp((visibleFrac - u * .85) * 6, 0, 1);
        if (showGiven) a = .32;
        if (a <= 0) continue;
        const ang = a0 + u * span;
        const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(x, y);
        ctx.rotate(ang + Math.PI / 2);
        const sc = i === k && !showGiven ? .6 + .4 * D.ease.back(a) : 1;
        ctx.scale(sc, sc);
        D.rr(ctx, -seatW / 2, -seatH / 2, seatW, seatH, Math.min(seatW, seatH) * .35);
        ctx.fillStyle = col; ctx.fill();
        ctx.restore();
      }
      // подписи: номер ряда на левом конце, число мест на правом (если хватает места)
      const fs = Math.max(10, Math.min(13, step * .7));
      if (step > 11 || given || last) {
        const lx = cx + Math.cos(a0) * r - 6, ly = cy + Math.sin(a0) * r - 2;
        D.text(ctx, String(i), lx, ly, { size: fs, weight: 600, align: 'right', color: C.ink3 });
      }
      if (!given && !last && i <= k && step > 22) {
        D.text(ctx, fmt(m.row(i)), cx + Math.cos(a1) * r + 6, cy + Math.sin(a1) * r - 2, { size: fs, weight: 700, align: 'left', color: col });
      }
      // известные и искомый ряды — подпись у вершины дуги
      if (given || (last && visibleFrac >= 1)) {
        const ang = -Math.PI / 2 + .5;
        const label = given ? `${i}-й ряд: ${fmt(m.row(i))} — дано` : `${i}-й ряд: ${fmt(m.row(i))}`;
        D.pill(ctx, label, cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, { bg: col, color: '#fff', size: 11.5, shadow: true });
      }
    }
    if (k === 0) D.text(ctx, 'Нажмите ▶ — ряды начнут заполняться от сцены', w / 2, 44, { size: 14, weight: 600, color: C.ink3 });
  },
});
</script>
</body>
</html>
