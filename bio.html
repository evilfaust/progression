<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колония бактерий — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const mass = (p, k) => p.a1 * Math.pow(p.q, k);
const timesWord = q => ({ 2: 'удваивается', 3: 'утраивается', 4: 'увеличивается в 4 раза', 5: 'увеличивается в 5 раз' }[q]);
function duration(min) {
  if (min % 60 === 0) { const hh = min / 60; return `${hh} ${Lab.plural(hh, 'час', 'часа', 'часов')}`; }
  return `${min} ${Lab.plural(min, 'минуту', 'минуты', 'минут')}`;
}
const GOLD = Math.PI * (3 - Math.sqrt(5));

Lab.model({
  id: 'bio',
  unit: 'Период',
  rate: .55,
  params: [
    { key: 'a1', sym: 'b_1', label: 'начальная масса', min: 1, max: 100, value: 13, unit: 'мг' },
    { key: 'q', sym: 'q', label: 'во сколько раз растёт', min: 2, max: 5, value: 3 },
    { key: 'T', sym: 'T', label: 'период роста', min: 5, max: 60, step: 5, value: 20, unit: 'мин' },
    { key: 'N', sym: 'k', label: 'число периодов', min: 1, max: 6, value: 3 },
  ],
  random: () => ({ a1: 2 + Math.floor(Math.random() * 40), q: 2 + Math.floor(Math.random() * 3), T: [10, 15, 20, 30][Math.floor(Math.random() * 4)], N: 2 + Math.floor(Math.random() * 3) }),
  compute: p => ({ total: p.N * p.T, M: mass(p, p.N) }),
  duration: p => p.N,

  problem: (p, m, v) => `В чашку Петри поместили колонию микроорганизмов массой ${v('a1')}&nbsp;мг. Каждые ${v('T')}&nbsp;минут масса колонии ${v('q', timesWord(p.q))}.
    <span class="q">Какой будет масса колонии через ${v('N', duration(m.total))}?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Сколько раз масса успеет вырасти', f: F(`k = \\frac{${m.total}}{${p.T}} = \\hl{${p.N}}`), always: true },
      { t: 'Массы в моменты 0, T, 2T, … — геометрическая прогрессия', f: F(`b_1 = ${p.a1},\\quad q = ${p.q}`), c: `<span style="font-size:14px">После <i>k</i> периодов масса — это член ${F(`b_{k+1}`)}, а не ${F('b_k')}</span>`, always: true },
      { t: 'Формула n-го члена', f: F('b_n = b_1*q^{n-1}'), c: F(`b_{${p.N + 1}} = ${p.a1}*${p.q}^{${p.N}} = \\ans{${fmt(m.M)}}`), final: true },
    ],
    answer: `${fmt(m.M)} мг`,
  }),

  terms: (p, m) => ({
    items: Array.from({ length: p.N + 1 }, (_, i) => ({ i: `${i * p.T} мин`, x: fmt(mass(p, i)), star: i === p.N })),
    now: t => (t >= p.N ? p.N + 1 : Math.floor(t + 1e-9) + 1),
    sum: () => 'Над числом — время от начала опыта, внутри — масса в мг.',
  }),

  hud: (p, m, t) => [
    { k: 'Время', v: fmt(t * p.T, 0), u: 'мин' },
    { k: 'Масса', v: fmt(p.a1 * Math.pow(p.q, t), t % 1 ? 0 : 2), u: 'мг', tone: 'acc' },
    { k: 'Рост', v: `×${fmt(Math.pow(p.q, t), t % 1 ? 1 : 0)}` },
  ],
  doneText: (p, m) => `Через ${duration(m.total)} масса колонии — ${fmt(m.M)} мг`,
  about: `<p class="lead">Бактерии делятся, и каждая новая клетка тоже начинает делиться. Поэтому за равные промежутки времени масса умножается на одно и то же число.</p>
    <p>Внутри периода колония растёт непрерывно — по закону <span class="m"><i>b</i>(<i>t</i>) = <i>b</i><sub>1</sub>·<i>q</i><sup><i>t</i>/<i>T</i></sup></span>. Геометрическая прогрессия — это значения массы в моменты 0, <i>T</i>, 2<i>T</i>, …</p>
    <p>На рисунке площадь колонии пропорциональна массе. Цвет показывает, в каком периоде появились клетки — видно, что большая часть колонии всегда «молодая».</p>
    <p>Частая ошибка — взять <i>b</i><sub>3</sub> вместо <i>b</i><sub>4</sub>: через три периода прошло три умножения, а это четвёртый член прогрессии.</p>` + Lab.THEORY.gp,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    ctx.fillStyle = dark ? '#0f1a17' : '#eef5ef'; ctx.fillRect(0, 0, w, h);
    // лабораторный стол — светлая клетка
    for (let x = 0; x < w; x += 40) D.line(ctx, x, 0, x, h, dark ? 'rgba(255,255,255,.025)' : 'rgba(0,80,40,.05)', 1);
    for (let y = 0; y < h; y += 40) D.line(ctx, 0, y, w, y, dark ? 'rgba(255,255,255,.025)' : 'rgba(0,80,40,.05)', 1);

    const cx = w * (w > 700 ? .44 : .5), cy = h * .55 + 10;
    const R = Math.max(60, Math.min(w * .36, h * .4));
    // чашка Петри
    D.shadow(ctx, 30, 'rgba(0,0,0,.25)', 10);
    D.circle(ctx, cx, cy, R + 14, dark ? '#1b2a26' : '#ffffff');
    D.noShadow(ctx);
    D.circle(ctx, cx, cy, R + 14, null, dark ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.08)', 2);
    const agar = ctx.createRadialGradient(cx - R * .3, cy - R * .3, R * .1, cx, cy, R);
    agar.addColorStop(0, dark ? '#3a3a1e' : '#fff7d1'); agar.addColorStop(1, dark ? '#2c2b17' : '#f7e7a6');
    D.circle(ctx, cx, cy, R, agar);

    // колония: площадь ∝ массе; финальная масса занимает ~80% площади
    const M = p.a1 * Math.pow(p.q, t);
    const area = .8 * Math.PI * R * R * (M / m.M);
    const cellR = Math.max(3.2, Math.min(9, R / 18));
    const cellA = Math.PI * Math.pow(cellR * 1.08, 2);
    const count = Math.max(1, area / cellA);
    const nFull = Math.floor(count), fr = count - nFull;
    const gens = [C.green, C.teal, C.cyan, C.blue, C.violet, C.rose, C.amber];
    const genOf = i => {
      // клетка i появилась, когда count впервые превысил i
      const ti = Math.log(((i + 1) * cellA) / (.8 * Math.PI * R * R) * m.M / p.a1) / Math.log(p.q);
      return Math.max(0, Math.ceil(ti - 1e-9));
    };
    const spacing = cellR * 1.95;
    for (let i = 0; i <= nFull && i < 6000; i++) {
      const rr = spacing * Math.sqrt(i + .5) * .56;
      if (rr > R - cellR) break;
      const a = i * GOLD;
      const wob = Math.sin(time * 2 + i) * cellR * .06;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      const sc = i === nFull ? D.ease.back(fr) : 1;
      if (sc <= .02) continue;
      const col = gens[genOf(i) % gens.length];
      D.circle(ctx, x, y, (cellR + wob) * sc, D.alpha(col, dark ? .85 : .8));
      D.circle(ctx, x - cellR * .25, y - cellR * .25, cellR * .3 * sc, 'rgba(255,255,255,.35)');
    }
    // блик на крышке
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R + 8, Math.PI * 1.1, Math.PI * 1.45);
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
    ctx.restore();
    D.pill(ctx, `${fmt(M, 0)} мг`, cx, cy + R + 32, { bg: C.acc, color: '#fff', size: 14, shadow: true, h: 30 });

    // часы
    if (w > 700) {
      const kx = w - 96, ky = 150, kr = 52;
      D.shadow(ctx, 16, 'rgba(0,0,0,.2)', 4);
      D.circle(ctx, kx, ky, kr, dark ? '#1f2b28' : '#fff');
      D.noShadow(ctx);
      const minutes = t * p.T;
      const sweep = (minutes % 60) / 60 * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(kx, ky); ctx.arc(kx, ky, kr - 6, -Math.PI / 2, -Math.PI / 2 + sweep); ctx.closePath();
      ctx.fillStyle = D.alpha(C.acc, .18); ctx.fill();
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2;
        D.line(ctx, kx + Math.cos(a) * (kr - 10), ky + Math.sin(a) * (kr - 10), kx + Math.cos(a) * (kr - 4), ky + Math.sin(a) * (kr - 4), C.ink3, i % 3 ? 1.2 : 2.2);
      }
      // отметки периодов
      for (let k = 0; k <= p.N; k++) {
        const a = -Math.PI / 2 + ((k * p.T) % 60) / 60 * Math.PI * 2;
        D.circle(ctx, kx + Math.cos(a) * (kr - 16), ky + Math.sin(a) * (kr - 16), 3, k <= t + 1e-9 ? C.acc : C.lineStrong);
      }
      const a = -Math.PI / 2 + sweep;
      D.line(ctx, kx, ky, kx + Math.cos(a) * (kr - 12), ky + Math.sin(a) * (kr - 12), C.acc, 3);
      D.circle(ctx, kx, ky, 4, C.acc);
      D.text(ctx, `${fmt(minutes, 0)} мин`, kx, ky + kr + 16, { size: 13, weight: 700, color: C.ink2 });
      // легенда поколений
      for (let k = 0; k <= Math.min(p.N, 6); k++) {
        const y = ky + kr + 44 + k * 22;
        D.circle(ctx, kx - 34, y, 6, D.alpha(gens[k % gens.length], .85));
        D.text(ctx, k === 0 ? 'исходные' : `${k}-й период`, kx - 22, y, { size: 11.5, align: 'left', weight: 600, color: k <= Math.ceil(t - 1e-9) ? C.ink2 : C.ink3 });
      }
    }
  },
});
</script>
</body>
</html>
