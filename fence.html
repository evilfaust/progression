<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маляры красят забор — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;

Lab.model({
  id: 'fence',
  unit: 'День',
  rate: .7,
  params: [
    { key: 'K', sym: 'a_1 + a_n', label: 'первый и последний день', min: 30, max: 150, step: 5, value: 90, unit: 'м' },
    { key: 'S', sym: 'S', label: 'длина забора', value: 270, unit: 'м',
      values: p => { const out = []; for (let n = 3; n <= 12; n++) if (Number.isInteger(n * p.K / 2)) out.push(n * p.K / 2); return out; } },
    { key: 'a1', sym: 'a_1', label: 'в первый день (для рисунка)', value: 15, unit: 'м',
      values: p => { const out = []; for (let a = 5; a < p.K / 2; a += 5) out.push(a); return out.length ? out : [Math.floor(p.K / 4)]; } },
  ],
  random() {
    const K = 30 + 5 * Math.floor(Math.random() * 20), n = 4 + Math.floor(Math.random() * 6);
    return { K, S: Number.isInteger(n * K / 2) ? n * K / 2 : (n + 1) * K / 2, a1: 5 * Math.max(1, Math.floor(Math.random() * (K / 10))) };
  },
  compute(p) {
    const n = Math.round(2 * p.S / p.K), an = p.K - p.a1, d = n > 1 ? (an - p.a1) / (n - 1) : 0;
    const day = k => p.a1 + (k - 1) * d;
    const sum = k => k * (2 * p.a1 + (k - 1) * d) / 2;
    return { n, an, d, day, sum };
  },
  duration: (p, m) => m.n,

  problem: (p, m, v) => `Бригада маляров красит забор длиной ${v('S')}&nbsp;м, ежедневно увеличивая норму покраски на одно и то же число метров. Известно, что за первый и последний день в сумме бригада покрасила ${v('K')}&nbsp;м.
    <span class="q">Сколько дней бригада красила весь забор?</span>`,
  problemNote: () => 'Метры по дням в условии не нужны — для ответа хватает суммы первого и последнего дня. Слайдер «в первый день» меняет только рисунок.',

  solution: (p, m) => ({
    steps: [
      { t: 'Метры по дням — арифметическая прогрессия', f: F(`S_n = ${p.S},\\quad a_1 + a_n = ${p.K}`), always: true },
      { t: 'Формула суммы содержит именно a₁ + aₙ', f: F('S_n = \\frac{a_1 + a_n}{2}*n'), c: F(`${p.S} = \\frac{${p.K}}{2}*n`) },
      { t: 'Выражаем число дней', f: F('n = \\frac{2S_n}{a_1 + a_n}'), c: F(`n = \\frac{2*${p.S}}{${p.K}} = \\ans{${m.n}}`), final: true },
    ],
    answer: `${m.n} ${Lab.plural(m.n, 'день', 'дня', 'дней')}`,
  }),

  terms: (p, m) => ({
    items: Array.from({ length: m.n }, (_, i) => ({ i: `${i + 1} д.`, x: fmt(m.day(i + 1), 1), mark: i === 0 || i === m.n - 1 })),
    sum: t => {
      const k = Math.min(Math.floor(t), m.n);
      return `Покрашено: <b>${fmt(m.sum(k), 1)}</b> из ${p.S} м. Рамкой — первый и последний день, их сумма ${p.K} м.`;
    },
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), m.n);
    return [
      { k: 'День', v: String(k) },
      { k: 'Покрашено', v: fmt(paintedAt(m, t), 0), u: `из ${p.S} м`, tone: 'acc' },
      { k: 'Сегодня', v: k ? fmt(m.day(k), 1) : '—', u: k ? 'м' : '' },
    ];
  },
  doneText: (p, m) => `Забор покрашен за ${m.n} ${Lab.plural(m.n, 'день', 'дня', 'дней')}`,
  about: `<p class="lead">Задача из ЕГЭ базового уровня, в которой ни первый член, ни разность не нужны.</p>
    <p>Формула суммы арифметической прогрессии <span class="m">S<sub><i>n</i></sub> = (a<sub>1</sub> + a<sub><i>n</i></sub>)·<i>n</i>/2</span> содержит как раз ту величину, которую дали в условии, — сумму первого и последнего членов. Остаётся выразить <i>n</i>.</p>
    <p>Смысл формулы хорошо виден на заборе: если поставить в пару первый и последний день, второй и предпоследний и т.д., каждая пара покрасит одинаково — по ${'a₁ + aₙ'} метров.</p>` + Lab.THEORY.ap,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    const k = Math.min(Math.ceil(t - 1e-9), m.n);
    const f = k ? t - (k - 1) : 0;
    // небо меняется в течение дня
    const dayPhase = k ? Math.sin(Math.PI * D.clamp(f, 0, 1)) : .6;
    const horizon = h * .6;
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    if (dark) { sky.addColorStop(0, '#0c1224'); sky.addColorStop(1, '#22284a'); }
    else { sky.addColorStop(0, D.mix('#f7c59f', '#9ad0ff', dayPhase)); sky.addColorStop(1, D.mix('#ffe8d2', '#e8f5ff', dayPhase)); }
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, horizon);
    if (dark) { D.stars(ctx, w, horizon, time, 4, 60); D.circle(ctx, w * .85, 70, 16, '#f4f1de'); }
    else {
      const sx = w * (.1 + .8 * (k ? f : .5)), sy = horizon - Math.sin(Math.PI * (k ? f : .5)) * (horizon - 70);
      D.glow(ctx, sx, sy, 70, '#ffd54a', .55); D.circle(ctx, sx, sy, 18, '#ffd54a');
    }
    // трава
    const gg = ctx.createLinearGradient(0, horizon, 0, h);
    gg.addColorStop(0, dark ? '#1b3324' : '#9bd59a'); gg.addColorStop(1, dark ? '#132519' : '#6fbf73');
    ctx.fillStyle = gg; ctx.fillRect(0, horizon, w, h - horizon);

    // забор
    const fx0 = 40, fx1 = w - 40, fw = fx1 - fx0;
    const fTop = horizon - Math.min(150, h * .24), fBot = horizon + 34;
    const xOf = d => fx0 + d / p.S * fw;
    const boards = Math.max(30, Math.min(140, Math.floor(fw / 11)));
    const bw = fw / boards;
    const palette = [C.green, C.teal, C.blue, C.violet, C.rose, C.orange, C.amber, C.cyan, C.indigo, C.red, C.green, C.teal];
    const painted = paintedAt(m, t);
    // поперечины
    ctx.fillStyle = dark ? '#5a4634' : '#c9a27a';
    ctx.fillRect(fx0, fTop + 22, fw, 10); ctx.fillRect(fx0, fBot - 34, fw, 10);
    for (let i = 0; i < boards; i++) {
      const x = fx0 + i * bw;
      const mid = (i + .5) / boards * p.S;
      ctx.beginPath();
      ctx.moveTo(x + 1.5, fBot); ctx.lineTo(x + 1.5, fTop + 8); ctx.lineTo(x + bw / 2, fTop); ctx.lineTo(x + bw - 1.5, fTop + 8); ctx.lineTo(x + bw - 1.5, fBot);
      ctx.closePath();
      ctx.fillStyle = dark ? '#7a6048' : '#e0bf98';
      ctx.fill();
      // покраска: доска окрашена частично, если граница проходит по ней
      const bx0 = i / boards * p.S, bx1 = (i + 1) / boards * p.S;
      if (painted > bx0) {
        let day = 1; while (day < m.n && m.sum(day) <= mid) day++;
        ctx.save(); ctx.clip();
        const px = Math.min(1, (painted - bx0) / (bx1 - bx0));
        ctx.fillStyle = palette[(day - 1) % palette.length];
        ctx.fillRect(x, fTop - 2, bw * px, fBot - fTop + 4);
        ctx.restore();
      }
      D.line(ctx, x + 1.5, fTop + 8, x + 1.5, fBot, 'rgba(0,0,0,.12)', 1);
    }
    // подписи дней под забором
    const done = Math.min(Math.floor(t + 1e-9), m.n);
    for (let d = 1; d <= done; d++) {
      const x0 = xOf(m.sum(d - 1)), x1 = xOf(m.sum(d));
      D.line(ctx, x1, fTop - 10, x1, fBot + 8, C.ink, 1.5, [3, 3]);
      const lbl = x1 - x0 > 70 ? `${d}-й день · ${fmt(m.day(d), 1)} м` : x1 - x0 > 34 ? `${fmt(m.day(d), 1)}` : '';
      if (lbl) D.pill(ctx, lbl, (x0 + x1) / 2, fBot + 24, { bg: palette[(d - 1) % palette.length], color: '#fff', size: 11 });
    }
    // маляр
    const px = xOf(painted);
    drawPainter(ctx, px, fBot + 6, Math.max(.8, Math.min(1.25, h / 460)), C, time, s.playing && k && f < .95);
    // линейка
    const ry = h - 34;
    D.dim(ctx, fx0, ry, fx1, ry, `весь забор ${p.S} м`, { color: C.ink3, bg: C.surface, labelColor: C.ink, size: 12 });
    // пары «первый + последний»
    if (t >= m.n && m.n > 1) {
      const pairs = Math.floor(m.n / 2);
      const shownPairs = Math.min(pairs, 3);
      for (let i = 1; i <= shownPairs; i++) {
        const a = (xOf(m.sum(i - 1)) + xOf(m.sum(i))) / 2, b = (xOf(m.sum(m.n - i)) + xOf(m.sum(m.n - i + 1))) / 2;
        const apex = fTop - 24 - (shownPairs - i + 1) * 30;
        const cpy = 2 * apex - (fTop - 6);
        ctx.beginPath(); ctx.moveTo(a, fTop - 6); ctx.quadraticCurveTo((a + b) / 2, cpy, b, fTop - 6);
        ctx.strokeStyle = D.alpha(C.ink, .45); ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
        D.pill(ctx, `${fmt(m.day(i), 1)} + ${fmt(m.day(m.n - i + 1), 1)} = ${p.K}`, (a + b) / 2, apex, { bg: C.surface, color: C.ink, size: 11.5, shadow: true });
      }
    }
  },
});

function paintedAt(m, t) {
  const k = Math.min(Math.floor(t), m.n);
  if (k >= m.n) return m.sum(m.n);
  const f = D.ease.inOut(D.clamp((t - k) / .9, 0, 1));
  return m.sum(k) + m.day(k + 1) * f;
}

function drawPainter(ctx, x, y, u, C, time, working) {
  const bob = working ? Math.sin(time * 10) * 2 : 0;
  ctx.save(); ctx.translate(x, y);
  // ноги
  D.line(ctx, -5 * u, 0, -6 * u, -22 * u, '#3b4a6b', 5 * u);
  D.line(ctx, 5 * u, 0, 6 * u, -22 * u, '#3b4a6b', 5 * u);
  // туловище (комбинезон)
  D.rr(ctx, -11 * u, -50 * u + bob, 22 * u, 30 * u, 8 * u); ctx.fillStyle = C.acc; ctx.fill();
  // голова и кепка
  D.circle(ctx, 0, -60 * u + bob, 9 * u, '#f2c6a0');
  ctx.beginPath(); ctx.arc(0, -63 * u + bob, 9.5 * u, Math.PI, 0); ctx.fillStyle = '#f5b700'; ctx.fill();
  ctx.fillRect(-2 * u, -64 * u + bob, 14 * u, 3 * u);
  // рука с валиком
  const ang = -1.1 + (working ? Math.sin(time * 10) * .35 : 0);
  const hx = Math.cos(ang) * 24 * u, hy = -44 * u + bob + Math.sin(ang) * 24 * u;
  D.line(ctx, 6 * u, -44 * u + bob, hx, hy, '#f2c6a0', 4 * u);
  D.line(ctx, hx, hy, hx - 2 * u, hy - 18 * u, '#555', 2.5 * u);
  D.rr(ctx, hx - 10 * u, hy - 26 * u, 16 * u, 8 * u, 3 * u); ctx.fillStyle = C.acc2; ctx.fill();
  ctx.restore();
}
</script>
</body>
</html>
