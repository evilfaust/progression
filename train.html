<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поезд отходит от станции — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const term = (p, k) => p.a1 + (k - 1) * p.d;
const sum = (p, k) => k * (2 * p.a1 + (k - 1) * p.d) / 2;
function pathAt(p, t) {
  const v0 = p.a1 - p.d / 2;
  if (v0 >= -1e-9) return v0 * t + p.d * t * t / 2;
  const k = Math.floor(t);
  return sum(p, k) + term(p, k + 1) * (t - k);
}

Lab.model({
  id: 'train',
  unit: 'Секунда',
  rate: .9,
  params: [
    { key: 'a1', sym: 'a_1', label: 'за первую секунду', min: .1, max: 3, step: .1, value: .2, unit: 'м', digits: 1 },
    { key: 'd', sym: 'd', label: 'прибавка каждую секунду', min: .1, max: 2, step: .1, value: .4, unit: 'м', digits: 1 },
    { key: 'N', sym: 'N', label: 'секунд', min: 1, max: 30, value: 10, unit: 'с' },
  ],
  random: () => ({ a1: (1 + Math.floor(Math.random() * 6)) / 10, d: (2 + Math.floor(Math.random() * 6)) / 10, N: 6 + Math.floor(Math.random() * 10) }),
  compute: p => ({ an: term(p, p.N), S: sum(p, p.N) }),
  duration: p => p.N,

  problem: (p, m, v) => `Поезд начал движение от станции. За первую секунду состав сдвинулся на ${v('a1')}&nbsp;м, а за каждую следующую секунду проходил на ${v('d')}&nbsp;м больше, чем за предыдущую.
    <span class="q">Сколько метров прошёл состав за первые ${v('N')}&nbsp;${Lab.plural(p.N, 'секунду', 'секунды', 'секунд')}?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Пути за каждую секунду — арифметическая прогрессия', f: F(`a_1 = ${fmt(p.a1)},\\quad d = ${fmt(p.d)}`), always: true },
      { t: `Путь за ${p.N}-ю секунду`, f: F('a_n = a_1 + (n - 1)*d'), c: F(`a_{${p.N}} = ${fmt(p.a1)} + ${p.N - 1}*${fmt(p.d)} = \\hl{${fmt(m.an)}}`) },
      { t: 'Весь путь — сумма первых N членов', f: F('S_n = \\frac{a_1 + a_n}{2}*n'), c: F(`S_{${p.N}} = \\frac{${fmt(p.a1)} + ${fmt(m.an)}}{2}*${p.N} = \\ans{${fmt(m.S)}}`), final: true },
    ],
    answer: `${fmt(m.S)} м`,
  }),

  terms: p => ({
    items: Array.from({ length: p.N }, (_, i) => ({ i: 'a' + Lab.sub(i + 1), x: fmt(term(p, i + 1)) })),
    sum: t => {
      const k = Math.min(Math.floor(t), p.N);
      return k ? F(`S_{${k}} = ${fmt(sum(p, k))}~\\t{м}`) : 'Слагаемые появятся по мере движения.';
    },
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    return [
      { k: 'Секунда', v: String(k), u: `из ${p.N}` },
      { k: 'Пройдено', v: fmt(pathAt(p, t), 2), u: 'м', tone: 'acc' },
      { k: 'За эту секунду', v: k ? fmt(term(p, k)) : '—', u: k ? 'м' : '' },
    ];
  },
  doneText: (p, m) => `За ${p.N} ${Lab.plural(p.N, 'секунду', 'секунды', 'секунд')} поезд прошёл ${fmt(m.S)} м`,
  about: `<p class="lead">Поезд трогается равноускоренно, поэтому пути за последовательные секунды образуют арифметическую прогрессию.</p>
    <p>При <span class="m">a<sub>1</sub> = 0,2</span> и <span class="m"><i>d</i> = 0,4</span> путь за <i>t</i> секунд равен <span class="m">0,2<i>t</i><sup>2</sup></span> — модель двигает состав именно так. Проверьте: за 10 секунд выходит 0,2 · 100 = 20 м.</p>` + Lab.THEORY.ap,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    const ground = h * .66;
    D.sky(ctx, w, ground, C);
    if (dark) D.stars(ctx, w, ground * .8, time, 5, 60);
    else { D.glow(ctx, w * .12, h * .2, 70, '#ffd54a', .5); D.circle(ctx, w * .12, h * .2, 20, '#ffd54a'); }
    // холмы (параллакс)
    const hills = (yb, amp, col, k) => {
      ctx.beginPath(); ctx.moveTo(0, ground);
      for (let x = 0; x <= w; x += 10) ctx.lineTo(x, yb - amp * (.5 + .5 * Math.sin(x * k + yb)));
      ctx.lineTo(w, ground); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    };
    hills(ground - 30, 40, dark ? '#1d2a3a' : '#bfe0c4', .006);
    hills(ground - 6, 26, dark ? '#21352c' : '#9fd3a5', .011);
    // земля
    ctx.fillStyle = dark ? '#1a2a22' : '#86c98d'; ctx.fillRect(0, ground, w, h - ground);
    ctx.fillStyle = dark ? '#2a2623' : '#c9b79c'; ctx.fillRect(0, ground + 10, w, 26);

    // масштаб: путь S_N укладывается в ширину сцены
    const startX = w * .36, endX = w - 30;
    const S = Math.max(m.S, 1e-6);
    const xOf = d => startX + (d / S) * (endX - startX);
    const railY = ground + 18;
    // шпалы и рельсы
    for (let x = -10; x < w + 10; x += 16) {
      D.rr(ctx, x, railY - 3, 10, 12, 2); ctx.fillStyle = dark ? '#4a3c30' : '#8b6a4a'; ctx.fill();
    }
    D.line(ctx, 0, railY, w, railY, dark ? '#9aa3b5' : '#6b7280', 3);
    D.line(ctx, 0, railY + 6, w, railY + 6, dark ? '#6c7486' : '#4b5563', 2);
    // платформа станции
    D.rr(ctx, -10, ground - 22, startX - 40, 22, 4); ctx.fillStyle = dark ? '#3b3f4d' : '#d6d3cd'; ctx.fill();
    ctx.fillStyle = dark ? '#c9a227' : '#f2c94c'; ctx.fillRect(-10, ground - 22, startX - 40, 3);
    const sx = Math.max(30, startX * .28);
    D.rr(ctx, sx - 32, ground - 86, 64, 64, 6); ctx.fillStyle = dark ? '#3a3350' : '#f1e3d3'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - 42, ground - 84); ctx.lineTo(sx, ground - 112); ctx.lineTo(sx + 42, ground - 84); ctx.closePath();
    ctx.fillStyle = dark ? '#6b3b3b' : '#c0504d'; ctx.fill();
    D.rr(ctx, sx - 8, ground - 52, 16, 30, 3); ctx.fillStyle = dark ? '#211d2c' : '#8a6d52'; ctx.fill();
    D.rr(ctx, sx - 26, ground - 72, 14, 12, 2); ctx.fillStyle = dark ? '#ffd166' : '#a7d3f5'; ctx.fill();
    D.rr(ctx, sx + 12, ground - 72, 14, 12, 2); ctx.fill();
    D.pill(ctx, 'СТАНЦИЯ', sx, ground - 124, { bg: dark ? '#2b3040' : '#fff', color: C.ink, size: 10.5, shadow: true });

    // линейка пути
    const ry = h - 32;
    D.line(ctx, startX, ry, endX, ry, C.lineStrong, 2);
    const done = Math.min(Math.floor(t + 1e-9), p.N);
    for (let k = 0; k <= p.N; k++) {
      const x = xOf(sum(p, k));
      const on = k <= done;
      D.line(ctx, x, ry - (on ? 7 : 4), x, ry + (on ? 7 : 4), on ? C.acc : C.lineStrong, on ? 2 : 1);
    }
    for (let k = 1; k <= done; k++) {
      const x0 = xOf(sum(p, k - 1)), x1 = xOf(sum(p, k));
      if (x1 - x0 > 30) D.text(ctx, `+${fmt(term(p, k))}`, (x0 + x1) / 2, ry - 12, { size: 11, weight: 700, color: C.acc });
      if (k === done || x1 - xOf(sum(p, k - 1)) > 40) D.text(ctx, `${k} с`, x1, ry + 17, { size: 10.5, weight: 600, color: C.ink3 });
    }
    D.text(ctx, '0', startX, ry + 17, { size: 10.5, weight: 600, color: C.ink3 });

    // поезд: нос — точка отсчёта пути
    const d = pathAt(p, t);
    const nose = xOf(d);
    const unit = Math.max(.9, Math.min(1.5, h / 380));
    const v = p.d * t + (p.a1 - p.d / 2);
    drawTrain(ctx, nose, railY - 4, unit, nose - startX, C, time, s.playing ? Math.min(1, v / Math.max(term(p, p.N), .1)) : 0);
    // пунктир от носа к линейке
    D.line(ctx, nose, railY + 10, nose, ry - 8, D.alpha(C.acc, .6), 1.5, [4, 4]);
    D.pill(ctx, `${fmt(d, 2)} м`, nose, ry - 26 - 6, { bg: C.acc, color: '#fff', size: 12, shadow: true });
  },
});

function drawTrain(ctx, nose, y, u, dist, C, time, puff) {
  const dark = C.dark;
  const body = dark ? '#4c7fe0' : '#2f6fdc', bodyD = dark ? '#3a63b6' : '#2357b0', trim = dark ? '#ffd166' : '#f5b700';
  const wheel = (x, r) => {
    ctx.save(); ctx.translate(x, y - r); ctx.rotate(dist / r);
    D.circle(ctx, 0, 0, r, '#2b2f3a'); D.circle(ctx, 0, 0, r * .62, '#9aa3b5');
    for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 4); D.line(ctx, -r * .6, 0, r * .6, 0, '#2b2f3a', 2); }
    D.circle(ctx, 0, 0, r * .2, '#2b2f3a');
    ctx.restore();
  };
  // вагоны
  const carW = 120 * u, carH = 52 * u, gap = 10 * u;
  const locoW = 130 * u;
  const cols = [[dark ? '#e0684b' : '#e8590c', dark ? '#b8513b' : '#c24a0a'], [dark ? '#3cb371' : '#2f9e44', dark ? '#2e8b57' : '#237a35']];
  for (let i = 0; i < 2; i++) {
    const x1 = nose - locoW - gap - i * (carW + gap);
    const x0 = x1 - carW;
    D.line(ctx, x1, y - 14 * u, x1 + gap, y - 14 * u, '#2b2f3a', 3);
    D.shadow(ctx, 10, 'rgba(0,0,0,.25)', 3);
    D.rr(ctx, x0, y - carH - 10 * u, carW, carH, 8 * u); ctx.fillStyle = cols[i][0]; ctx.fill();
    D.noShadow(ctx);
    ctx.fillStyle = cols[i][1]; ctx.fillRect(x0, y - 22 * u, carW, 6 * u);
    for (let j = 0; j < 3; j++) {
      D.rr(ctx, x0 + 10 * u + j * 36 * u, y - carH - 2 * u, 26 * u, 18 * u, 4 * u);
      ctx.fillStyle = dark ? '#ffe9a8' : '#dff1ff'; ctx.fill();
    }
    wheel(x0 + 22 * u, 11 * u); wheel(x1 - 22 * u, 11 * u);
  }
  // локомотив
  const lx = nose - locoW;
  D.shadow(ctx, 12, 'rgba(0,0,0,.28)', 3);
  D.rr(ctx, lx, y - 50 * u, locoW - 12 * u, 40 * u, 10 * u); ctx.fillStyle = body; ctx.fill();
  D.rr(ctx, lx, y - 82 * u, 48 * u, 72 * u, 8 * u); ctx.fillStyle = bodyD; ctx.fill();
  D.noShadow(ctx);
  D.rr(ctx, lx - 4 * u, y - 88 * u, 56 * u, 9 * u, 4 * u); ctx.fillStyle = '#2b2f3a'; ctx.fill();
  D.rr(ctx, lx + 10 * u, y - 74 * u, 28 * u, 22 * u, 4 * u); ctx.fillStyle = dark ? '#ffe9a8' : '#dff1ff'; ctx.fill();
  // нос-конус и труба
  ctx.beginPath();
  ctx.moveTo(nose - 12 * u, y - 50 * u); ctx.quadraticCurveTo(nose + 4 * u, y - 30 * u, nose - 12 * u, y - 10 * u); ctx.closePath();
  ctx.fillStyle = bodyD; ctx.fill();
  D.rr(ctx, nose - 44 * u, y - 74 * u, 14 * u, 26 * u, 3 * u); ctx.fillStyle = '#2b2f3a'; ctx.fill();
  ctx.fillStyle = trim; ctx.fillRect(lx, y - 30 * u, locoW - 12 * u, 4 * u);
  D.circle(ctx, nose - 6 * u, y - 36 * u, 4.5 * u, dark ? '#fff3bf' : '#fff8db');
  if (dark) D.glow(ctx, nose + 10 * u, y - 36 * u, 60 * u, '#fff3bf', .35);
  wheel(lx + 22 * u, 13 * u); wheel(lx + 58 * u, 13 * u); wheel(nose - 30 * u, 13 * u);
  // дым
  const sx = nose - 37 * u, sy = y - 78 * u;
  for (let i = 0; i < 7; i++) {
    const ph = ((time * (0.6 + puff) + i / 7) % 1);
    const r = (6 + ph * 18) * u;
    const a = (1 - ph) * (.28 + .3 * puff);
    D.circle(ctx, sx - ph * (40 + 70 * puff) * u, sy - ph * 46 * u, r, dark ? `rgba(200,205,220,${a})` : `rgba(255,255,255,${a + .15})`);
  }
}
</script>
</body>
</html>
