<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Торможение автомобиля — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const term = (p, k) => p.v1 - (k - 1) * p.d;
const sum = (p, k) => k * (2 * p.v1 - (k - 1) * p.d) / 2;
const stopN = p => Math.ceil(p.v1 / p.d - 1e-9);

// Положение машины: равнозамедленно s = ut − dt²/2 (u = v₁ + d/2) — в целые секунды
// совпадает с суммами прогрессии; последнюю секунду плавно гасим скорость до нуля.
function pathAt(p, m, t) {
  const n = m.n, u = p.v1 + p.d / 2;
  if (t <= n - 1) return u * t - p.d * t * t / 2;
  const f = Math.min(1, t - (n - 1));
  const vs = u - p.d * (n - 1), an = term(p, n);
  return sum(p, n - 1) + vs * f + (3 * an - 2 * vs) * f * f + (vs - 2 * an) * f * f * f;
}
function speedAt(p, m, t) {
  const n = m.n, u = p.v1 + p.d / 2;
  if (t <= n - 1) return u - p.d * t;
  const f = Math.min(1, t - (n - 1)), vs = u - p.d * (n - 1), an = term(p, n);
  return vs + 2 * (3 * an - 2 * vs) * f + 3 * (vs - 2 * an) * f * f;
}

Lab.model({
  id: 'car',
  unit: 'Секунда',
  rate: .9,
  params: [
    { key: 'v1', sym: 'a_1', label: 'путь за первую секунду', min: 5, max: 60, value: 30, unit: 'м' },
    { key: 'd', sym: 'd', label: 'на сколько меньше каждую секунду', min: 1, max: 15, value: 5, unit: 'м' },
  ],
  random: () => { const d = 2 + Math.floor(Math.random() * 6); return { d, v1: d * (3 + Math.floor(Math.random() * 6)) }; },
  compute: p => { const n = stopN(p); return { n, an: term(p, n), S: sum(p, n) }; },
  duration: (p, m) => m.n,

  problem: (p, m, v) => `Автомобиль начал тормозить. За первую секунду после начала торможения он проехал ${v('v1')}&nbsp;м, а за каждую следующую секунду — на ${v('d')}&nbsp;м меньше, чем за предыдущую.
    <span class="q">Какой путь проедет автомобиль до полной остановки?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Пути за секунды — убывающая арифметическая прогрессия', f: F(`a_1 = ${p.v1},\\quad d = -${p.d}`), always: true },
      { t: 'Машина едет, пока путь за секунду положителен', f: F(`${p.v1} - ${p.d}(n - 1) > 0 \\Rightarrow n < ${fmt(p.v1 / p.d + 1)}`), c: F(`n = \\hl{${m.n}}~\\t{с},\\quad a_{${m.n}} = \\hl{${m.an}}`) },
      { t: 'Тормозной путь — сумма всех членов', f: F('S_n = \\frac{a_1 + a_n}{2}*n'), c: F(`S_{${m.n}} = \\frac{${p.v1} + ${m.an}}{2}*${m.n} = \\ans{${fmt(m.S)}}`), final: true },
    ],
    answer: `${fmt(m.S)} м`,
  }),

  terms: (p, m) => ({
    items: Array.from({ length: m.n }, (_, i) => ({ i: 'a' + Lab.sub(i + 1), x: fmt(term(p, i + 1)) })),
    sum: t => {
      const k = Math.min(Math.floor(t), m.n);
      return k ? F(`S_{${k}} = ${fmt(sum(p, k))}~\\t{м}`) : 'Каждую секунду путь уменьшается на d.';
    },
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), m.n);
    const v = Math.max(0, speedAt(p, m, t));
    return [
      { k: 'Секунда', v: String(k), u: `из ${t >= m.n ? m.n : '?'}` },
      { k: 'Проехал', v: fmt(pathAt(p, m, t), 1), u: 'м', tone: 'acc' },
      { k: 'Скорость', v: fmt(v * 3.6, 0), u: 'км/ч', tone: t >= m.n ? 'bad' : '' },
    ];
  },
  doneText: (p, m) => `Остановка через ${m.n} с — тормозной путь ${fmt(m.S)} м`,
  about: `<p class="lead">При торможении пути за последовательные секунды убывают на одну и ту же величину — это убывающая арифметическая прогрессия с отрицательной разностью.</p>
    <p>Главное в задаче — понять, <strong>сколько членов</strong> складывать. Машина едет, пока путь за секунду положителен; как только очередной член стал бы нулём или отрицательным, автомобиль уже стоит.</p>
    <p>Скорость на табло пересчитана в км/ч: путь за первую секунду 30 м — это примерно 117 км/ч в начале торможения.</p>` + Lab.THEORY.ap,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    const roadTop = h * .56, roadBot = h * .84;
    D.sky(ctx, w, roadTop, C, dark ? {} : { top: '#cfe8ff', bottom: '#f4f9ff' });
    if (dark) D.stars(ctx, w, roadTop * .7, time, 8, 50);
    // город вдали
    const rb = D.rand(4);
    for (let x = -10; x < w; x += 28 + rb() * 30) {
      const bh = 30 + rb() * 80, bw = 24 + rb() * 30;
      ctx.fillStyle = dark ? '#1b2236' : '#dbe5f1';
      ctx.fillRect(x, roadTop - bh, bw, bh);
      if (dark) for (let wy = roadTop - bh + 8; wy < roadTop - 6; wy += 12) for (let wx = x + 5; wx < x + bw - 6; wx += 9) if (rb() < .35) { ctx.fillStyle = 'rgba(255,214,102,.6)'; ctx.fillRect(wx, wy, 4, 5); }
    }
    ctx.fillStyle = dark ? '#1c2a22' : '#9fd39f'; ctx.fillRect(0, roadTop - 8, w, 8);
    // дорога
    const rg = ctx.createLinearGradient(0, roadTop, 0, roadBot);
    rg.addColorStop(0, dark ? '#2a2e38' : '#5b616e'); rg.addColorStop(1, dark ? '#20232b' : '#474c57');
    ctx.fillStyle = rg; ctx.fillRect(0, roadTop, w, roadBot - roadTop);
    ctx.fillStyle = dark ? '#3a3f4b' : '#d9d9d9'; ctx.fillRect(0, roadTop, w, 4); ctx.fillRect(0, roadBot - 4, w, 4);
    const laneY = (roadTop + roadBot) / 2;
    for (let x = 0; x < w; x += 46) { ctx.fillStyle = dark ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.8)'; ctx.fillRect(x, laneY - 2, 24, 4); }
    ctx.fillStyle = dark ? '#151a14' : '#7cbf7c'; ctx.fillRect(0, roadBot, w, h - roadBot);

    const startX = Math.max(140, w * .17), endX = w - 70;
    const xOf = d => startX + d / Math.max(m.S, 1) * (endX - startX);
    const carY = laneY + (roadBot - laneY) * .55;
    const dist = pathAt(p, m, t), x = xOf(dist);
    const done = Math.min(Math.floor(t + 1e-9), m.n);

    // следы торможения
    if (t > 0) {
      const g = ctx.createLinearGradient(startX, 0, x, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, dark ? 'rgba(0,0,0,.5)' : 'rgba(20,20,20,.35)');
      ctx.fillStyle = g;
      ctx.fillRect(startX - 40, carY - 4, x - startX - 30, 4);
      ctx.fillRect(startX - 40, carY - 22, x - startX - 30, 3);
    }
    // столбики-отметки каждой секунды
    D.line(ctx, startX, roadTop + 6, startX, roadBot - 6, '#ffffff', 3, [6, 5]);
    D.pill(ctx, 'начало торможения', startX, roadTop - 26, { bg: C.bad, color: '#fff', size: 11 });
    for (let k = 1; k <= done; k++) {
      const xk = xOf(sum(p, k)), xp = xOf(sum(p, k - 1));
      D.line(ctx, xk, roadTop - 12, xk, roadTop + 6, dark ? '#e9ecef' : '#495057', 2);
      D.rr(ctx, xk - 1, roadTop - 30, 22, 14, 3); ctx.fillStyle = dark ? '#ffd43b' : '#f59f00'; ctx.fill();
      D.text(ctx, `${k}с`, xk + 10, roadTop - 23, { size: 9.5, weight: 800, color: '#1c1a21' });
      if (xk - xp > 34) {
        D.dim(ctx, xp + 3, roadBot + 18, xk - 3, roadBot + 18, `${fmt(term(p, k))} м`, { color: dark ? '#c9f0c9' : '#ffffff', bg: dark ? '#1f3a22' : '#2f7d32', labelColor: '#fff', size: 11 });
      }
    }
    if (t >= m.n) {
      D.pill(ctx, 'СТОП', x - 75 * Math.max(.8, Math.min(1.3, h / 420)), carY - 100 * Math.max(.8, Math.min(1.3, h / 420)), { bg: C.bad, color: '#fff', size: 12, shadow: true });
      D.dim(ctx, startX, h - 18, x, h - 18, `тормозной путь ${fmt(m.S)} м`, { color: dark ? '#ffd8d8' : '#fff', bg: C.bad, labelColor: '#fff', size: 12 });
    }
    drawCar(ctx, x, carY, Math.max(.8, Math.min(1.3, h / 420)), x - startX, C, t > 0);
  },
});

function drawCar(ctx, nose, y, u, roll, C, braking) {
  const dark = C.dark;
  const L = 150 * u, x0 = nose - L;
  const body = dark ? '#f06595' : '#d6336c', bodyD = dark ? '#c2255c' : '#a61e4d';
  D.shadow(ctx, 14, 'rgba(0,0,0,.35)', 5);
  ctx.beginPath();
  ctx.moveTo(x0 + 8 * u, y - 14 * u);
  ctx.lineTo(x0 + 6 * u, y - 36 * u);
  ctx.quadraticCurveTo(x0 + 10 * u, y - 44 * u, x0 + 30 * u, y - 46 * u);
  ctx.lineTo(x0 + 48 * u, y - 46 * u);
  ctx.quadraticCurveTo(x0 + 66 * u, y - 72 * u, x0 + 92 * u, y - 72 * u);
  ctx.lineTo(x0 + 108 * u, y - 72 * u);
  ctx.quadraticCurveTo(x0 + 124 * u, y - 70 * u, x0 + 134 * u, y - 48 * u);
  ctx.quadraticCurveTo(nose, y - 44 * u, nose, y - 30 * u);
  ctx.lineTo(nose - 2 * u, y - 14 * u);
  ctx.closePath();
  ctx.fillStyle = body; ctx.fill();
  D.noShadow(ctx);
  ctx.fillStyle = bodyD; ctx.fillRect(x0 + 8 * u, y - 24 * u, L - 10 * u, 6 * u);
  // окна
  ctx.beginPath();
  ctx.moveTo(x0 + 56 * u, y - 48 * u); ctx.quadraticCurveTo(x0 + 70 * u, y - 66 * u, x0 + 90 * u, y - 66 * u);
  ctx.lineTo(x0 + 92 * u, y - 48 * u); ctx.closePath();
  ctx.fillStyle = dark ? '#a5d8ff' : '#d0ebff'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x0 + 98 * u, y - 66 * u); ctx.lineTo(x0 + 106 * u, y - 66 * u); ctx.quadraticCurveTo(x0 + 120 * u, y - 64 * u, x0 + 128 * u, y - 48 * u);
  ctx.lineTo(x0 + 98 * u, y - 48 * u); ctx.closePath(); ctx.fill();
  // фары и стоп-сигнал
  D.rr(ctx, nose - 10 * u, y - 38 * u, 9 * u, 7 * u, 3); ctx.fillStyle = '#fff3bf'; ctx.fill();
  if (dark) D.glow(ctx, nose + 30 * u, y - 34 * u, 70 * u, '#fff3bf', .3);
  D.rr(ctx, x0 + 4 * u, y - 40 * u, 7 * u, 9 * u, 2); ctx.fillStyle = braking ? '#ff2d2d' : '#8f1d1d'; ctx.fill();
  if (braking) D.glow(ctx, x0 + 6 * u, y - 36 * u, 34 * u, '#ff2d2d', .55);
  // колёса
  for (const wx of [x0 + 34 * u, nose - 34 * u]) {
    ctx.save(); ctx.translate(wx, y - 12 * u); ctx.rotate(roll / (14 * u));
    D.circle(ctx, 0, 0, 15 * u, '#1f2128'); D.circle(ctx, 0, 0, 8 * u, '#adb5bd');
    for (let i = 0; i < 5; i++) { ctx.rotate(Math.PI * 2 / 5); D.line(ctx, 0, 0, 7 * u, 0, '#495057', 2); }
    D.circle(ctx, 0, 0, 2.5 * u, '#495057');
    ctx.restore();
  }
}
</script>
</body>
</html>
