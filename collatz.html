<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гипотеза Коллатца — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
function orbit(n) {
  const s = [n];
  while (n !== 1 && s.length < 5000) { n = n % 2 === 0 ? n / 2 : 3 * n + 1; s.push(n); }
  return s;
}
const stepsOf = n => orbit(n).length - 1;
const RECORDS = Array.from({ length: 100 }, (_, i) => ({ n: i + 1, s: stepsOf(i + 1) })).sort((a, b) => b.s - a.s).slice(0, 8);
const PICKS = [7, 27, 97, 871, 6171, 77031];
const pick = n => window.labModel && (window.labModel.set('n', n), window.labModel.play(true));

Lab.model({
  id: 'collatz',
  startAtEnd: true,
  unit: 'Шаг',
  rate: (p, m) => Math.max(5, m.steps / 11),
  speeds: [.5, 1, 2, 4],
  labels: { problem: 'Правило', solution: 'Траектория', terms: 'Последовательность' },
  params: [
    { key: 'n', label: 'Начальное число (Enter — запустить)', type: 'number', min: 1, max: 999999, value: 27 },
    { key: 'scale', label: 'Шкала', type: 'seg', value: 'lin', options: [{ value: 'lin', label: 'Обычная' }, { value: 'log', label: 'Логарифмическая' }] },
  ],
  compute: p => {
    const seq = orbit(p.n), max = Math.max(...seq);
    return { seq, max, maxAt: seq.indexOf(max), steps: seq.length - 1, odd: seq.filter(x => x % 2).length };
  },
  duration: (p, m) => m.steps,

  problem: (p, m, v) => `Возьмём натуральное число. Если оно <b>чётное</b> — разделим на 2, если <b>нечётное</b> — умножим на 3 и прибавим 1. С результатом сделаем то же самое, и так далее.
    <span class="q">Гипотеза: с какого бы числа мы ни начали, рано или поздно придём к 1. Проверим для ${v('n', fmt(p.n))}.</span>`,
  problemNote: () => 'Это правило записано в 1937 году Лотаром Коллатцем. Гипотеза проверена компьютером для всех чисел до 2⁶⁸ ≈ 3·10²⁰, но доказательства до сих пор нет.',

  solutionOptions: { reveal: false },
  solution: (p, m) => ({
    steps: [
      { t: 'Правило', f: F('a_{k+1} = \\frac{a_k}{2}~\\t{(если чётно)},\\quad a_{k+1} = 3a_k + 1~\\t{(если нечётно)}'), always: true },
      { t: 'Длина пути до единицы', f: `${F(`${fmt(p.n)} \\to \\ldots \\to 1`)}: <b>${m.steps}</b> ${Lab.plural(m.steps, 'шаг', 'шага', 'шагов')}`, always: true },
      { t: 'Самая высокая точка', f: `максимум <b>${fmt(m.max)}</b> на шаге ${m.maxAt} — в ${fmt(m.max / p.n, 1)} раза больше старта`, always: true },
      { t: 'Чётных и нечётных шагов', f: `${m.steps - m.odd + 1} чётных · ${m.odd} нечётных`, always: true },
    ],
  }),
  terms: (p, m) => ({
    items: m.seq.map((x, i) => ({ i: String(i), x: fmt(x), mark: i === m.maxAt && m.max > p.n })),
    now: t => Math.min(m.seq.length - 1, Math.floor(t + 1e-9)),
    max: 36,
  }),
  cards: [
    {
      id: 'now', title: 'Сейчас', icon: 'spark', at: 'after-problem',
      step(body, t, p, m) {
        const i = Math.min(m.steps, Math.floor(t + 1e-9));
        const x = m.seq[i], nx = m.seq[i + 1];
        const even = x % 2 === 0;
        const op = nx === undefined ? (x === 1 ? 'Пришли к 1 — дальше цикл 1 → 4 → 2 → 1' : '') : even ? `${fmt(x)} чётное → ${fmt(x)} : 2 = ${fmt(nx)}` : `${fmt(x)} нечётное → 3 · ${fmt(x)} + 1 = ${fmt(nx)}`;
        body.innerHTML = `<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
            <span style="font-size:40px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:${even ? 'var(--acc)' : '#e8590c'}">${fmt(x)}</span>
            <span class="chip" style="background:${even ? 'var(--acc-soft)' : 'rgba(232,89,12,.14)'};color:${even ? 'var(--acc-ink)' : '#e8590c'}">${even ? 'чётное' : 'нечётное'}</span></div>
          <div style="margin-top:6px;color:var(--ink-2);font-size:14.5px">${op}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">${PICKS.map(n => `<button class="btn sm" onclick="pick(${n})">${fmt(n)}</button>`).join('')}</div>`;
      },
    },
    {
      id: 'records', title: 'Рекордсмены от 1 до 100', icon: 'list', at: 'end',
      render: () => `<div class="bars">${RECORDS.map(r => `<div class="bar-row"><button onclick="pick(${r.n})" title="Показать">${r.n}</button>
        <div class="track"><span style="width:${r.s / RECORDS[0].s * 100}%"></span></div><span class="n">${r.s}</span></div>`).join('')}</div>
        <p class="note">Число шагов до единицы. Нажмите на число, чтобы построить его траекторию.</p>`,
    },
  ],

  hud: (p, m, t) => {
    const i = Math.min(m.steps, Math.floor(t + 1e-9));
    const maxSoFar = Math.max(...m.seq.slice(0, i + 1));
    return [
      { k: 'Шаг', v: String(i), u: `из ${t >= m.steps ? m.steps : '?'}` },
      { k: 'Число', v: fmt(m.seq[i]), tone: 'acc' },
      { k: 'Максимум', v: fmt(maxSoFar) },
    ];
  },
  doneText: (p, m) => `${fmt(p.n)} пришло к 1 за ${m.steps} ${Lab.plural(m.steps, 'шаг', 'шага', 'шагов')}`,
  about: `
    <p class="lead">Задача, понятная пятикласснику, которую не могут решить лучшие математики мира уже почти сто лет.</p>
    <div class="box">чётное n → n / 2<br>нечётное n → 3n + 1</div>
    <p>Гипотеза Коллатца утверждает: из любого натурального числа последовательность обязательно придёт к 1 (и дальше будет повторять 1 → 4 → 2 → 1).</p>
    <h3>Число 27</h3>
    <p>Знаменитый пример: скромное 27 за 111 шагов взлетает до <strong>9232</strong> и только потом падает к единице. Соседние числа ведут себя совершенно по-разному: 26 приходит к 1 за 10 шагов, а 27 — за 111.</p>
    <h3>Что известно</h3>
    <ul>
      <li>Гипотеза проверена для всех чисел до <strong>2<sup>68</sup> ≈ 2,95·10<sup>20</sup></strong>.</li>
      <li>В 2019 году Теренс Тао доказал, что «почти все» траектории опускаются сколь угодно низко — но это ещё не доказательство гипотезы.</li>
      <li>Пауль Эрдёш говорил: <em>«Математика ещё не готова к таким задачам»</em>.</li>
    </ul>
    <h3>Почему график такой рваный</h3>
    <p>Нечётный шаг увеличивает число примерно в 3 раза, а за ним всегда следует деление на 2. В среднем на каждый рост в 3 раза приходится около двух делений на 2 — поэтому «в среднем» траектория медленно спускается, но может надолго взлетать. Переключите шкалу на логарифмическую — так видно, что подъёмы и спуски похожи на случайное блуждание.</p>
    <p>Попробуйте: <strong>97</strong> (118 шагов), <strong>871</strong> (178 шагов), <strong>77 031</strong> (350 шагов).</p>`,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    ctx.fillStyle = dark ? '#0e1419' : '#f8fcfd'; ctx.fillRect(0, 0, w, h);
    const mg = { l: 64, r: 26, t: 96, b: 40 };
    const pw = w - mg.l - mg.r, ph = h - mg.t - mg.b;
    const n = m.seq.length;
    const log = p.scale === 'log';
    const yv = v => (log ? Math.log10(v) / Math.max(1e-9, Math.log10(m.max)) : (v - 1) / Math.max(1, m.max - 1));
    const X = i => mg.l + (n > 1 ? i / (n - 1) : .5) * pw, Y = v => mg.t + ph - yv(v) * ph;
    const evenC = C.acc, oddC = dark ? '#ff8a3d' : '#e8590c';
    // сетка
    const ticks = log ? Array.from({ length: Math.floor(Math.log10(m.max)) + 1 }, (_, i) => Math.pow(10, i)) : D.ticks(m.max, 5);
    ticks.forEach(v => {
      if (v < 1 || v > m.max * 1.001) return;
      const y = Y(v);
      D.line(ctx, mg.l, y, mg.l + pw, y, D.alpha(C.ink3, .14), 1);
      D.text(ctx, Lab.short(v), mg.l - 8, y, { size: 10.5, align: 'right', color: C.ink3 });
    });
    D.line(ctx, mg.l, mg.t + ph, mg.l + pw, mg.t + ph, C.lineStrong, 1.5);
    const xt = D.ticks(n - 1, 6);
    xt.forEach(i => D.text(ctx, String(i), X(i), mg.t + ph + 14, { size: 10.5, color: C.ink3 }));
    D.text(ctx, 'шаг', mg.l + pw, mg.t + ph + 28, { size: 10.5, align: 'right', color: C.ink3 });

    const i0 = Math.min(n - 1, Math.floor(t + 1e-9)), f = Math.min(1, t - i0);
    // заливка под кривой
    const path = () => {
      ctx.beginPath(); ctx.moveTo(X(0), Y(m.seq[0]));
      for (let i = 1; i <= i0; i++) ctx.lineTo(X(i), Y(m.seq[i]));
      if (i0 < n - 1) ctx.lineTo(D.lerp(X(i0), X(i0 + 1), f), D.lerp(Y(m.seq[i0]), Y(m.seq[i0 + 1]), f));
    };
    path();
    const cx = i0 < n - 1 ? D.lerp(X(i0), X(i0 + 1), f) : X(i0);
    ctx.lineTo(cx, mg.t + ph); ctx.lineTo(X(0), mg.t + ph); ctx.closePath();
    const g = ctx.createLinearGradient(0, mg.t, 0, mg.t + ph);
    g.addColorStop(0, D.alpha(C.acc, .25)); g.addColorStop(1, D.alpha(C.acc, 0));
    ctx.fillStyle = g; ctx.fill();
    // отрезки цветом чётности
    ctx.lineCap = 'round';
    for (let i = 1; i <= Math.min(i0 + 1, n - 1); i++) {
      const fr = i <= i0 ? 1 : f;
      if (fr <= 0) continue;
      const a = [X(i - 1), Y(m.seq[i - 1])], b = [X(i), Y(m.seq[i])];
      D.line(ctx, a[0], a[1], D.lerp(a[0], b[0], fr), D.lerp(a[1], b[1], fr), m.seq[i - 1] % 2 ? oddC : evenC, n > 150 ? 1.6 : 2.4);
    }
    if (n <= 140) for (let i = 0; i <= i0; i++) D.circle(ctx, X(i), Y(m.seq[i]), 2.6, m.seq[i] % 2 ? oddC : evenC);
    // максимум
    if (m.maxAt <= i0 && m.max > p.n) {
      const mx = X(m.maxAt), my = Y(m.max);
      D.circle(ctx, mx, my, 6, null, C.amber, 2.5);
      D.pill(ctx, `максимум ${fmt(m.max)}`, Math.min(w - 70, Math.max(80, mx)), my - 18, { bg: C.amber, color: '#1c1a21', size: 11.5, shadow: true });
    }
    // текущая точка
    const cy = i0 < n - 1 ? D.lerp(Y(m.seq[i0]), Y(m.seq[i0 + 1]), f) : Y(m.seq[i0]);
    D.glow(ctx, cx, cy, 22, C.acc, .45 + .15 * Math.sin(time * 5));
    D.circle(ctx, cx, cy, 5.5, '#fff', C.acc, 3);
    if (t >= m.steps && m.steps > 0) D.pill(ctx, `1 за ${m.steps} ${Lab.plural(m.steps, 'шаг', 'шага', 'шагов')}`, Math.min(cx - 10, w - 80), cy - 20, { bg: C.good, color: '#fff', size: 12, shadow: true, align: 'right' });
    // легенда
    D.circle(ctx, mg.l + 8, mg.t - 14, 5, evenC); D.text(ctx, 'после чётного: n / 2', mg.l + 18, mg.t - 14, { size: 11.5, align: 'left', color: C.ink2 });
    D.circle(ctx, mg.l + 168, mg.t - 14, 5, oddC); D.text(ctx, 'после нечётного: 3n + 1', mg.l + 178, mg.t - 14, { size: 11.5, align: 'left', color: C.ink2 });
  },
});
</script>
</body>
</html>
