<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Радиоактивный распад — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const mass = (p, k) => p.a1 / Math.pow(2, k);
const ATOMS = 256;
// случайный, но воспроизводимый порядок распада атомов
const ORDER = (() => {
  const r = D.rand(2024), a = Array.from({ length: ATOMS }, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const rank = new Array(ATOMS);
  a.forEach((atom, i) => { rank[atom] = i; });
  return rank;
})();
// атом с номером распада r распадается, когда осталось меньше ATOMS − r атомов: 256·2^(−t) < 256 − r
const decayTime = r => -Math.log2(1 - (r + 1) / ATOMS);

Lab.model({
  id: 'radio',
  unit: 'Период',
  rate: .6,
  params: [
    { key: 'a1', sym: 'b_1', label: 'начальная масса', value: 640, unit: 'мг', values: () => Array.from({ length: 11 }, (_, i) => 10 * Math.pow(2, i)) },
    { key: 'T', sym: 'T', label: 'период полураспада', min: 1, max: 30, value: 7, unit: 'мин' },
    { key: 'N', sym: 'k', label: 'число периодов', min: 1, max: 8, value: 6 },
  ],
  random: () => ({ a1: 10 * Math.pow(2, 3 + Math.floor(Math.random() * 6)), T: 2 + Math.floor(Math.random() * 15), N: 2 + Math.floor(Math.random() * 5) }),
  compute: p => ({ total: p.N * p.T, M: mass(p, p.N), B: p.a1 - mass(p, p.N) }),
  duration: p => p.N,

  problem: (p, m, v) => `Масса радиоактивного изотопа уменьшается вдвое каждые ${v('T')}&nbsp;${Lab.plural(p.T, 'минуту', 'минуты', 'минут')}. В начальный момент масса изотопа составляла ${v('a1')}&nbsp;мг.
    <span class="q">Найдите массу изотопа через ${v('N', m.total)}&nbsp;${Lab.plural(m.total, 'минуту', 'минуты', 'минут')}.</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Сколько периодов полураспада прошло', f: F(`k = \\frac{${m.total}}{${p.T}} = \\hl{${p.N}}`), always: true },
      { t: 'Массы через каждый период — геометрическая прогрессия', f: F(`b_1 = ${p.a1},\\quad q = \\frac{1}{2}`), always: true },
      { t: `После ${p.N} периодов — член с номером ${p.N + 1}`, f: F('b_n = b_1*q^{n-1}'), c: F(`b_{${p.N + 1}} = ${p.a1}*(\\frac{1}{2})^{${p.N}} = \\frac{${p.a1}}{${Math.pow(2, p.N)}} = \\ans{${fmt(m.M)}}`), final: true },
    ],
    answer: `${fmt(m.M)} мг`,
  }),

  terms: p => ({
    items: Array.from({ length: p.N + 1 }, (_, i) => ({ i: `${i * p.T} мин`, x: fmt(mass(p, i)), star: i === p.N })),
    now: t => (t >= p.N ? p.N + 1 : Math.floor(t + 1e-9) + 1),
  }),

  cards: [{
    id: 'product', title: 'Продукт распада', icon: 'spark', at: 'after-solution',
    render: (p, m) => `<p class="note" style="margin:0 0 8px">Распавшаяся часть изотопа превращается в другое вещество. Его масса — разность:</p>
      <div class="step-f">${F(`B = b_1 - b_{${p.N + 1}} = ${p.a1} - ${fmt(m.M)} = \\hl{${fmt(m.B)}~\\t{мг}}`)}</div>`,
  }],

  hud: (p, m, t) => {
    const left = p.a1 * Math.pow(2, -t);
    return [
      { k: 'Время', v: fmt(t * p.T, 1), u: 'мин' },
      { k: 'Осталось', v: fmt(left, left < 10 ? 2 : 0), u: 'мг', tone: 'acc' },
      { k: 'Распалось', v: fmt(p.a1 - left, 0), u: 'мг' },
      { k: 'Доля', v: fmt(100 * Math.pow(2, -t), t ? 1 : 0), u: '%' },
    ];
  },
  doneText: (p, m) => `Через ${m.total} мин осталось ${fmt(m.M)} мг изотопа`,
  about: `<p class="lead">Каждый атом распадается случайно, но атомов так много, что за любой период полураспада исчезает почти ровно половина оставшихся.</p>
    <p>На рисунке 256 атомов. Распавшиеся атомы гаснут и превращаются в продукт распада. Справа — график массы: точки в моменты 0, <i>T</i>, 2<i>T</i>, … — это члены геометрической прогрессии со знаменателем ½.</p>
    <div class="box">m(t) = m<sub>0</sub>·(1/2)<sup>t/T</sup></div>
    <p>Период полураспада у разных изотопов отличается невероятно: у полония-214 — доли миллисекунды, у урана-238 — 4,5 миллиарда лет. На этом основан радиоуглеродный анализ возраста находок.</p>` + Lab.THEORY.gp,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, dark ? '#0b1420' : '#f2f9fc'); bg.addColorStop(1, dark ? '#0f1d2a' : '#e5f3f8');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

    const wide = w > 720;
    const top = 92;
    const areaW = wide ? w * .48 : w - 40, areaH = wide ? h - top - 30 : (h - top) * .55;
    const ax = 20, ay = top;
    const cols = 16, rows = 16;
    const cell = Math.min(areaW / cols, areaH / rows);
    const gx = ax + (areaW - cell * cols) / 2, gy = ay + (areaH - cell * rows) / 2;
    D.rr(ctx, gx - 12, gy - 12, cell * cols + 24, cell * rows + 24, 18);
    ctx.fillStyle = dark ? 'rgba(255,255,255,.03)' : 'rgba(255,255,255,.7)'; ctx.fill();
    ctx.strokeStyle = dark ? 'rgba(59,201,219,.18)' : 'rgba(12,143,181,.18)'; ctx.lineWidth = 1.5; ctx.stroke();
    for (let i = 0; i < ATOMS; i++) {
      const x = gx + (i % cols + .5) * cell, y = gy + (Math.floor(i / cols) + .5) * cell;
      const td = decayTime(ORDER[i]);
      const r = cell * .3;
      if (t < td) {
        const pulse = 1 + .06 * Math.sin(time * 3 + i);
        D.glow(ctx, x, y, r * 2.2, C.cyan, dark ? .35 : .22);
        D.circle(ctx, x, y, r * pulse, C.cyan);
        D.circle(ctx, x - r * .3, y - r * .3, r * .32, 'rgba(255,255,255,.55)');
      } else {
        const since = t - td;
        if (since < .25) {
          const u = since / .25;
          D.circle(ctx, x, y, r * (1 + u * 1.6), null, D.alpha(C.amber, 1 - u), 2);
          D.glow(ctx, x, y, r * 3, C.amber, .6 * (1 - u));
        }
        D.circle(ctx, x, y, r * .55, dark ? '#5c4a2f' : '#e9c58a');
      }
    }
    D.text(ctx, 'каждая точка — 1/256 массы', gx + cell * cols / 2, gy + cell * rows + 26, { size: 11.5, color: C.ink3 });

    // график
    const px = wide ? w * .55 : 40, py = wide ? top + 10 : top + areaH + 40;
    const pw = wide ? w - px - 30 : w - 70, ph = wide ? h - py - 50 : h - py - 34;
    if (ph < 60) return;
    D.line(ctx, px, py + ph, px + pw, py + ph, C.lineStrong, 1.5);
    D.line(ctx, px, py, px, py + ph, C.lineStrong, 1.5);
    const X = k => px + k / p.N * pw, Y = v => py + ph - v / p.a1 * ph;
    [0, .25, .5, .75, 1].forEach(f => {
      const y = Y(p.a1 * f);
      D.line(ctx, px, y, px + pw, y, D.alpha(C.ink3, .15), 1);
      D.text(ctx, fmt(p.a1 * f), px - 6, y, { size: 10.5, align: 'right', color: C.ink3 });
    });
    // кривая
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) { const tt = i / 120 * p.N; const x = X(tt), y = Y(p.a1 * Math.pow(2, -tt)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = D.alpha(C.cyan, .25); ctx.lineWidth = 2; ctx.setLineDash([4, 5]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath();
    for (let i = 0; i <= 120 * t / p.N; i++) { const tt = i / 120 * p.N; const x = X(tt), y = Y(p.a1 * Math.pow(2, -tt)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    const x1 = X(t), y1 = Y(p.a1 * Math.pow(2, -t));
    ctx.lineTo(x1, y1);
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 3; ctx.stroke();
    ctx.lineTo(x1, py + ph); ctx.lineTo(X(0), py + ph); ctx.closePath();
    const fg = ctx.createLinearGradient(0, py, 0, py + ph);
    fg.addColorStop(0, D.alpha(C.cyan, .28)); fg.addColorStop(1, D.alpha(C.cyan, 0));
    ctx.fillStyle = fg; ctx.fill();
    for (let k = 0; k <= p.N; k++) {
      const on = k <= t + 1e-9;
      const x = X(k), y = Y(mass(p, k));
      D.text(ctx, `${k * p.T}`, x, py + ph + 14, { size: 10.5, color: C.ink3 });
      if (!on) continue;
      D.circle(ctx, x, y, 5.5, C.surface, C.cyan, 3);
      if (k < 4 || k === p.N) D.text(ctx, fmt(mass(p, k)), x + 8, y - 12, { size: 11.5, weight: 700, align: 'left', color: C.ink });
    }
    D.circle(ctx, x1, y1, 4, C.cyan);
    D.text(ctx, 'мин', px + pw, py + ph + 28, { size: 10.5, align: 'right', color: C.ink3 });
    D.text(ctx, 'масса, мг', px, py - 14, { size: 11, align: 'left', color: C.ink3 });
  },
});
</script>
</body>
</html>
