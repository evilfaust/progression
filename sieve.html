<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Решето Эратосфена — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
let hover = null;

function sieve(N) {
  const spf = new Array(N + 1).fill(0);
  const P = [];
  for (let p = 2; p * p <= N; p++) if (!spf[p]) { P.push(p); for (let x = p * p; x <= N; x += p) if (!spf[x]) spf[x] = p; }
  const primes = [];
  for (let x = 2; x <= N; x++) if (!spf[x]) primes.push(x);
  // момент, когда число получает статус (простое / вычеркнуто)
  const when = new Array(N + 1).fill(Infinity);
  const big = primes.filter(x => x * x > N);
  P.forEach((p, u) => {
    when[p] = u + .04;
    const mult = []; for (let x = p * p; x <= N; x += p) mult.push(x);
    mult.forEach((x, j) => { if (spf[x] === p) when[x] = u + .2 + .75 * j / mult.length; });
  });
  big.forEach((x, i) => { when[x] = P.length + .05 + .8 * i / Math.max(1, big.length); });
  return { spf, P, primes, when, big };
}
function factor(x) {
  const out = [];
  for (let p = 2; p * p <= x; p++) { let e = 0; while (x % p === 0) { x /= p; e++; } if (e) out.push(e > 1 ? `${p}${Lab.sup(e)}` : String(p)); }
  if (x > 1) out.push(String(x));
  return out.join(' · ');
}
function layout(s) {
  const { w, h, p } = s;
  const cols = p.N <= 120 ? 10 : p.N <= 240 ? 15 : 20;
  const rows = Math.ceil(p.N / cols);
  const top = 104, pad = 20;
  const cell = Math.min((w - pad * 2) / cols, (h - top - pad) / rows, 64);
  const x0 = (w - cell * cols) / 2, y0 = top + (h - top - pad - cell * rows) / 2;
  return { cols, cell, pos: x => [x0 + ((x - 1) % cols) * cell, y0 + Math.floor((x - 1) / cols) * cell] };
}

Lab.model({
  id: 'sieve',
  unit: 'Этап',
  rate: .42,
  labels: { problem: 'Алгоритм', terms: 'Найденные простые' },
  params: [
    { key: 'N', sym: 'N', label: 'числа до', min: 20, max: 400, value: 100 },
  ],
  compute: p => sieve(p.N),
  duration: (p, m) => m.P.length + 1,
  timeLabel: (t, p, m, dur) => {
    const u = Math.min(Math.floor(t + 1e-9), dur);
    if (t <= 0) return 'Готовы начать';
    if (u < m.P.length) return `Вычёркиваем кратные <b>${m.P[u]}</b>`;
    if (t < dur) return `<b>Остались простые</b>`;
    return `Готово: <b>${m.primes.length}</b> простых`;
  },

  problem: (p, m, v) => `Выпишем все числа от 2 до ${v('N')}. Первое невычеркнутое число — простое; вычеркнем все его кратные, начиная с его квадрата. Возьмём следующее невычеркнутое число и повторим, пока его квадрат не превысит ${v('N')}.
    <span class="q">Сколько простых чисел останется в решете?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Хватит простых, не больших √N', f: F(`p \\le \\sqrt{${p.N}} \\approx ${fmt(Math.sqrt(p.N), 2)}`), c: F(`p \\in \\{${m.P.join(', ')}\\}`) },
      { t: 'Почему начинаем с p²', f: `<span style="font-size:14.5px">Меньшие кратные <i>p</i> уже вычеркнуты меньшими простыми: например, 2·7 и 3·7 убрали ещё на шагах для 2 и 3.</span>`, always: true },
      { t: 'Считаем оставшиеся', f: F(`\\pi(${p.N}) = \\ans{${m.primes.length}}`), c: F(`\\frac{N}{\\ln N} = \\frac{${p.N}}{\\ln ${p.N}} \\approx ${fmt(p.N / Math.log(p.N), 1)}`), final: true },
    ],
    answer: `${m.primes.length} ${Lab.plural(m.primes.length, 'простое число', 'простых числа', 'простых чисел')}`,
  }),

  terms: (p, m) => ({
    items: m.primes.map(x => ({ i: '', x: String(x), mark: m.P.includes(x) })),
    now: t => m.primes.filter(x => m.when[x] <= t).length,
    max: 60,
    sum: () => 'Рамкой отмечены простые, кратные которых пришлось вычёркивать.',
  }),

  hud: (p, m, t) => {
    if (hover) {
      const x = hover;
      const st = x === 1 ? 'ни простое, ни составное' : m.spf[x] ? factor(x) : 'простое';
      return [{ k: 'Число', v: String(x), tone: 'acc' }, { k: m.spf[x] ? 'Разложение' : 'Это', v: st }];
    }
    const u = Math.floor(t + 1e-9);
    const crossed = Object.keys(m.when).filter(x => m.spf[x] && m.when[x] <= t).length;
    const found = m.primes.filter(x => m.when[x] <= t).length;
    return [
      { k: 'Простое', v: u < m.P.length && t > 0 ? String(m.P[u]) : '—', tone: 'acc' },
      { k: 'Вычеркнуто', v: String(crossed) },
      { k: 'Простых', v: String(found), tone: 'good' },
    ];
  },
  pointer(s, x, y, type) {
    if (type === 'leave') { const was = hover; hover = null; return !!was; }
    const L = layout(s);
    const [x0, y0] = L.pos(1);
    const c = Math.floor((x - x0) / L.cell), r = Math.floor((y - y0) / L.cell);
    const n = r * L.cols + c + 1;
    const next = c >= 0 && c < L.cols && r >= 0 && n >= 1 && n <= s.p.N ? n : null;
    const changed = next !== hover;
    hover = next;
    return changed;
  },
  onChange: () => { hover = null; },
  doneText: (p, m) => `До ${p.N} — ${m.primes.length} простых чисел`,
  about: `
    <p class="lead">Простые числа — «атомы» арифметики: любое натуральное число единственным образом раскладывается в их произведение. Решету Эратосфена больше 2200 лет, и это до сих пор лучший способ найти все простые до N.</p>
    <h3>История</h3>
    <p><strong>Эратосфен Киренский</strong> (≈ 276–194 до н. э.) — математик, поэт, географ и главный библиотекарь Александрийской библиотеки. Он первым измерил окружность Земли с ошибкой около 2% и придумал этот алгоритм — «просеивание» чисел.</p>
    <h3>Алгоритм</h3>
    <div class="box">1. Выписать числа от 2 до N<br>2. Первое невычеркнутое p — простое<br>3. Вычеркнуть p², p² + p, p² + 2p, …<br>4. Повторять, пока p² ≤ N<br>5. Все оставшиеся — простые</div>
    <p>Сложность — <strong>O(N·log log N)</strong>, почти линейная. Наведите курсор на любое число, чтобы увидеть его разложение на простые множители.</p>
    <h3>Сколько простых?</h3>
    <p>Простые встречаются всё реже. <strong>Теорема о распределении простых</strong> (Адамар и Валле-Пуссен, 1896): <span class="m">π(N) ≈ N / ln N</span>. До 100 их 25, до 1000 — 168, до миллиона — 78 498.</p>
    <h3>Их бесконечно много</h3>
    <p>Доказательство <strong>Евклида</strong>: пусть простых конечно много — p₁, …, pₖ. Число p₁·p₂·…·pₖ + 1 не делится ни на одно из них, значит, у него есть простой делитель вне списка. Противоречие!</p>
    <h3>Нерешённые задачи</h3>
    <ul>
      <li><strong>Гипотеза Гольдбаха (1742):</strong> любое чётное число больше 2 — сумма двух простых. Проверено до 4·10<sup>18</sup>, но не доказано.</li>
      <li><strong>Простые-близнецы:</strong> бесконечно ли много пар (p, p + 2), вроде 11 и 13, 17 и 19?</li>
      <li><strong>Гипотеза Римана</strong> о распределении простых — одна из «задач тысячелетия» с призом в миллион долларов.</li>
    </ul>
    <h3>Зачем это нужно</h3>
    <p>На простых числах держится шифрование RSA: перемножить два больших простых легко, а разложить произведение обратно — почти невозможно.</p>`,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    ctx.fillStyle = dark ? '#14111a' : '#fdf8fa'; ctx.fillRect(0, 0, w, h);
    const L = layout(s);
    const pal = [C.rose, C.blue, C.green, C.amber, C.violet, C.teal, C.orange, C.cyan];
    const u = Math.floor(t + 1e-9);
    const cur = u < m.P.length && t > 0 ? m.P[u] : null;
    const cs = L.cell;
    for (let x = 1; x <= p.N; x++) {
      const [cx, cy] = L.pos(x);
      const pad = Math.max(1.5, cs * .07);
      const isPrime = x > 1 && !m.spf[x];
      const at = m.when[x];
      const doneSt = t >= at;
      let fill = dark ? '#221d2b' : '#ffffff', text = C.ink, stroke = dark ? '#2e2838' : '#efe4ea';
      if (x === 1) { fill = dark ? '#1a1620' : '#f4eff2'; text = C.ink3; }
      if (doneSt && isPrime) {
        const pi = m.P.indexOf(x);
        fill = pi >= 0 ? pal[pi % pal.length] : (dark ? '#e6c449' : '#f2b705');
        text = '#fff';
      } else if (doneSt) {
        const pi = m.P.indexOf(m.spf[x]);
        fill = D.alpha(pal[pi % pal.length], dark ? .16 : .12);
        text = D.alpha(dark ? '#ffffff' : '#000000', .25);
      }
      const pop = doneSt ? D.ease.back(D.clamp((t - at) / .12, 0, 1)) : 1;
      const sc = doneSt && t - at < .12 ? .82 + .18 * pop : 1;
      ctx.save();
      ctx.translate(cx + cs / 2, cy + cs / 2); ctx.scale(sc, sc);
      D.rr(ctx, -cs / 2 + pad, -cs / 2 + pad, cs - pad * 2, cs - pad * 2, Math.min(10, cs * .2));
      ctx.fillStyle = fill; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = stroke; ctx.stroke();
      if (hover === x) { ctx.lineWidth = 2.5; ctx.strokeStyle = C.ink; ctx.stroke(); }
      if (cs > 16) D.text(ctx, String(x), 0, .5, { size: Math.min(cs * .36, 18), weight: 700, color: text });
      if (doneSt && !isPrime && x > 1) {
        const pi = m.P.indexOf(m.spf[x]);
        const k = D.clamp((t - at) / .1, 0, 1);
        D.line(ctx, -cs * .28, cs * .28, -cs * .28 + cs * .56 * k, cs * .28 - cs * .56 * k, D.alpha(pal[pi % pal.length], .85), Math.max(1.5, cs * .06));
      }
      ctx.restore();
    }
    // текущее простое: пульсирующее кольцо и «бегунок» по кратным
    if (cur) {
      const [cx, cy] = L.pos(cur);
      const col = pal[u % pal.length];
      D.circle(ctx, cx + cs / 2, cy + cs / 2, cs * (.6 + .08 * Math.sin(time * 6)), null, col, 3);
      const f = t - u;
      if (f > .2 && f < .95) {
        const mult = []; for (let x = cur * cur; x <= p.N; x += cur) mult.push(x);
        const j = Math.min(mult.length - 1, Math.floor((f - .2) / .75 * mult.length));
        const [mx, my] = L.pos(mult[j]);
        D.glow(ctx, mx + cs / 2, my + cs / 2, cs, col, .5);
      }
      D.pill(ctx, `шаг ${cur}: ${cur}², ${cur}² + ${cur}, …`, w / 2, 86, { bg: col, color: '#fff', size: 12.5, shadow: true });
    } else if (t >= m.P.length && t > 0) {
      D.pill(ctx, `Все невычеркнутые числа — простые`, w / 2, 86, { bg: dark ? '#e6c449' : '#f2b705', color: '#1c1a21', size: 12.5, shadow: true });
    }
  },
});
</script>
</body>
</html>
