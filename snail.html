<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Улитка между деревьями — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const DAY = .78; // доля «суток», когда улитка ползёт; остальное — ночь

Lab.model({
  id: 'snail',
  unit: 'День',
  rate: (p, m) => Math.max(.8, m.n / 12),
  params: [
    { key: 'K', sym: 'a_1 + a_n', label: 'первый и последний день', min: 4, max: 30, value: 10, unit: 'м' },
    { key: 'S', sym: 'S', label: 'расстояние между деревьями', value: 150, unit: 'м',
      values: p => { const out = []; for (let n = 4; n <= 40; n++) if (Number.isInteger(n * p.K / 2)) out.push(n * p.K / 2); return out; } },
    { key: 'a1', sym: 'a_1', label: 'в первый день (для рисунка)', value: 2, unit: 'м', digits: 1,
      values: p => { const out = []; for (let a = .5; a < p.K / 2 - 1e-9; a += .5) out.push(a); return out; } },
  ],
  random() {
    const K = 4 + Math.floor(Math.random() * 20), n = 10 + Math.floor(Math.random() * 20);
    return { K, S: Number.isInteger(n * K / 2) ? n * K / 2 : (n + 1) * K / 2, a1: Math.max(.5, Math.floor(K / 5 * 2) / 2) };
  },
  compute(p) {
    const n = Math.round(2 * p.S / p.K), an = p.K - p.a1, d = n > 1 ? (an - p.a1) / (n - 1) : 0;
    return { n, an, d, day: k => p.a1 + (k - 1) * d, sum: k => k * (2 * p.a1 + (k - 1) * d) / 2 };
  },
  duration: (p, m) => m.n,

  problem: (p, m, v) => `Улитка ползёт от одного дерева до другого. Каждый день она проползает на одно и то же расстояние больше, чем в предыдущий. Известно, что за первый и последний дни улитка проползла в общей сложности ${v('K')}&nbsp;м.
    <span class="q">Сколько дней улитка потратила на весь путь, если расстояние между деревьями равно ${v('S')}&nbsp;м?</span>`,
  problemNote: () => 'Путь за первый день в условии не дан — слайдер «в первый день» меняет только рисунок, а ответ от него не зависит.',

  solution: (p, m) => ({
    steps: [
      { t: 'Пути по дням — арифметическая прогрессия', f: F(`S_n = ${p.S},\\quad a_1 + a_n = ${p.K}`), always: true },
      { t: 'Подставим в формулу суммы', f: F('S_n = \\frac{a_1 + a_n}{2}*n'), c: F(`${p.S} = \\frac{${p.K}}{2}*n`) },
      { t: 'Число дней', f: F('n = \\frac{2S_n}{a_1 + a_n}'), c: F(`n = \\frac{2*${p.S}}{${p.K}} = \\ans{${m.n}}`), final: true },
    ],
    answer: `${m.n} ${Lab.plural(m.n, 'день', 'дня', 'дней')}`,
  }),

  terms: (p, m) => ({
    items: Array.from({ length: m.n }, (_, i) => ({ i: `${i + 1} д.`, x: fmt(m.day(i + 1), 2), mark: i === 0 || i === m.n - 1 })),
    max: 24,
    sum: t => `Пройдено <b>${fmt(m.sum(Math.min(Math.floor(t), m.n)), 1)}</b> из ${p.S} м`,
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), m.n);
    const night = k && t - (k - 1) > DAY && t < m.n;
    return [
      { k: night ? 'Ночь' : 'День', v: String(k) },
      { k: 'Пройдено', v: fmt(crawled(m, t), 1), u: `из ${p.S} м`, tone: 'acc' },
      { k: 'За день', v: k ? fmt(m.day(k), 2) : '—', u: k ? 'м' : '' },
    ];
  },
  doneText: (p, m) => `Улитка добралась за ${m.n} ${Lab.plural(m.n, 'день', 'дня', 'дней')}`,
  about: `<p class="lead">Ещё одна задача, где решение умещается в одну формулу суммы.</p>
    <p>Улитке нужно пройти расстояние <i>S</i>, и сумма первого и последнего дня известна. Формула <span class="m">S<sub><i>n</i></sub> = (a<sub>1</sub> + a<sub><i>n</i></sub>)·<i>n</i>/2</span> сразу даёт число дней.</p>
    <p>Обратите внимание: в начале пути улитка ползёт медленно, а к концу заметно быстрее — но «в среднем» каждый день она проходит ровно <span class="m">(a<sub>1</sub> + a<sub><i>n</i></sub>)/2</span> метров.</p>` + Lab.THEORY.ap,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const k = Math.min(Math.ceil(t - 1e-9), m.n);
    const f = k ? t - (k - 1) : .3;
    const finished = t >= m.n;
    // свет: днём ярко, ночью темно; в тёмной теме всегда сумерки
    const light = finished ? 1 : f < DAY ? Math.min(1, Math.min(f, DAY - f) * 8 + .25) : 0;
    const dayL = C.dark ? light * .35 : light;
    const horizon = h * .62;
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, D.mix('#0b1026', '#8ec9ff', dayL)); sky.addColorStop(1, D.mix('#232a52', '#e6f4ff', dayL));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, horizon);
    if (dayL < .6) { ctx.globalAlpha = 1 - dayL / .6; D.stars(ctx, w, horizon * .8, time, 9, 80); ctx.globalAlpha = 1; }
    // солнце/луна по дуге
    const arcP = f < DAY ? f / DAY : (f - DAY) / (1 - DAY);
    const bx = w * (.1 + .8 * arcP), by = horizon - Math.sin(Math.PI * arcP) * (horizon - 80);
    if (f < DAY || finished) { D.glow(ctx, bx, by, 60, '#ffd54a', .5 * Math.max(.3, dayL)); D.circle(ctx, bx, by, 16, '#ffd54a'); }
    else { D.circle(ctx, bx, by, 14, '#f1f3f5'); D.circle(ctx, bx + 5, by - 4, 12, D.mix('#0b1026', '#8ec9ff', dayL)); }
    // холм и трава
    const gg = ctx.createLinearGradient(0, horizon, 0, h);
    gg.addColorStop(0, D.mix('#13261b', '#8fd18f', dayL)); gg.addColorStop(1, D.mix('#0d1a13', '#5fb565', dayL));
    ctx.fillStyle = gg; ctx.fillRect(0, horizon, w, h - horizon);

    const x0 = Math.max(90, w * .1), x1 = w - Math.max(90, w * .1);
    const groundY = horizon + (h - horizon) * .38;
    const xOf = d => x0 + d / p.S * (x1 - x0);
    drawTree(ctx, x0 - 34, groundY, Math.min(170, h * .42), dayL);
    drawTree(ctx, x1 + 34, groundY, Math.min(190, h * .46), dayL);

    // след по дням
    const dist = crawled(m, t), xs = xOf(dist);
    const cols = [C.teal, C.cyan];
    const done = Math.min(Math.floor(t + 1e-9), m.n);
    for (let d = 1; d <= Math.min(k, m.n); d++) {
      const a = xOf(m.sum(d - 1)), b = d <= done ? xOf(m.sum(d)) : xs;
      ctx.fillStyle = D.alpha(cols[d % 2], .75);
      D.rr(ctx, a, groundY + 4, Math.max(0, b - a - 1), 6, 3); ctx.fill();
      if (d <= done) D.line(ctx, b, groundY + 1, b, groundY + 14, D.alpha(C.ink, .5), 1.2);
    }
    // подписи «день — метры»: только когда помещаются
    for (let d = 1; d <= done; d++) {
      const a = xOf(m.sum(d - 1)), b = xOf(m.sum(d));
      if (b - a > 44) D.text(ctx, fmt(m.day(d), 1), (a + b) / 2, groundY + 24, { size: 10.5, weight: 700, color: C.dark ? '#d6f5ee' : '#0b6f66' });
    }
    if (done >= 1 && m.n > 1) {
      const a = xOf(0), b = xOf(m.sum(1));
      D.pill(ctx, `1-й день: ${fmt(p.a1, 1)} м`, Math.max(a + 50, (a + b) / 2), groundY + 44, { bg: C.surface, color: C.ink, size: 11, shadow: true });
    }
    if (finished) {
      const a = xOf(m.sum(m.n - 1)), b = xOf(m.sum(m.n));
      D.pill(ctx, `${m.n}-й день: ${fmt(m.an, 1)} м`, Math.min(b - 50, (a + b) / 2), groundY + 44, { bg: C.surface, color: C.ink, size: 11, shadow: true });
    }
    D.dim(ctx, x0, h - 22, x1, h - 22, `${p.S} м`, { color: D.mix('#cfd8e3', '#3a4a5a', dayL), bg: C.surface, labelColor: C.ink, size: 12 });

    const sleeping = k && f > DAY && !finished;
    drawSnail(ctx, xs, groundY + 2, Math.max(.75, Math.min(1.3, h / 480)), time, s.playing && !sleeping, sleeping, C);
    if (sleeping) D.text(ctx, 'z z z', xs + 10, groundY - 60 - Math.sin(time * 2) * 4, { size: 15, weight: 800, color: '#cfd8ff' });
  },
});

function crawled(m, t) {
  const k = Math.min(Math.floor(t), m.n);
  if (k >= m.n) return m.sum(m.n);
  const f = D.clamp((t - k) / DAY, 0, 1);
  return m.sum(k) + m.day(k + 1) * D.ease.inOut(f);
}

function drawTree(ctx, x, y, hgt, dayL) {
  ctx.fillStyle = D.mix('#2b1a10', '#8a5a3c', dayL);
  D.rr(ctx, x - hgt * .07, y - hgt * .5, hgt * .14, hgt * .5 + 4, 4); ctx.fill();
  const leaf = D.mix('#163d24', '#3fa34d', dayL), leaf2 = D.mix('#1d4d2e', '#5cbf63', dayL);
  D.circle(ctx, x, y - hgt * .72, hgt * .3, leaf);
  D.circle(ctx, x - hgt * .2, y - hgt * .55, hgt * .22, leaf);
  D.circle(ctx, x + hgt * .2, y - hgt * .57, hgt * .23, leaf2);
  D.circle(ctx, x + hgt * .05, y - hgt * .9, hgt * .18, leaf2);
}

function drawSnail(ctx, x, y, u, time, moving, sleeping, C) {
  ctx.save(); ctx.translate(x, y);
  const stretch = moving ? 1 + Math.sin(time * 6) * .06 : 1;
  // тело
  ctx.beginPath();
  ctx.moveTo(-34 * u, 0);
  ctx.quadraticCurveTo(-10 * u, -6 * u, 18 * u * stretch, -2 * u);
  ctx.quadraticCurveTo(30 * u * stretch, -4 * u, 30 * u * stretch, -16 * u);
  ctx.quadraticCurveTo(28 * u * stretch, -24 * u, 20 * u * stretch, -22 * u);
  ctx.lineTo(10 * u, -10 * u);
  ctx.lineTo(-34 * u, -6 * u);
  ctx.closePath();
  ctx.fillStyle = '#d9b38c'; ctx.fill();
  // рожки
  if (!sleeping) {
    const wig = Math.sin(time * 3) * 2 * u;
    D.line(ctx, 24 * u * stretch, -20 * u, 30 * u * stretch + wig, -36 * u, '#c79c72', 2.2 * u);
    D.line(ctx, 20 * u * stretch, -20 * u, 22 * u * stretch - wig, -36 * u, '#c79c72', 2.2 * u);
    D.circle(ctx, 30 * u * stretch + wig, -37 * u, 2.6 * u, '#3d2b1f');
    D.circle(ctx, 22 * u * stretch - wig, -37 * u, 2.6 * u, '#3d2b1f');
  }
  // раковина-спираль
  const sx = -10 * u, sy = -22 * u, R = 19 * u;
  D.circle(ctx, sx, sy, R, '#c26a3a');
  ctx.beginPath();
  for (let a = 0; a < Math.PI * 5; a += .15) { const r = R * .9 * (1 - a / (Math.PI * 5.4)); const px = sx + Math.cos(a) * r, py = sy + Math.sin(a) * r; a ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.strokeStyle = '#8a3f1a'; ctx.lineWidth = 2.2 * u; ctx.stroke();
  D.circle(ctx, sx - R * .35, sy - R * .4, R * .2, 'rgba(255,255,255,.25)');
  ctx.restore();
}
</script>
</body>
</html>
