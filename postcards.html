<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Открытки Веры — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const ASK = 4;

Lab.model({
  id: 'postcards',
  unit: 'День',
  rate: (p) => Math.max(.7, p.N / 14),
  params: [
    { key: 'N', sym: 'n', label: 'дней', min: 5, max: 20, value: 16 },
    { key: 'a1', sym: 'a_1', label: 'в первый день', min: 2, max: 20, value: 10 },
    { key: 'S', sym: 'S', label: 'всего открыток', value: 640, keepIndex: true,
      values: p => Array.from({ length: 10 }, (_, i) => p.N * p.a1 + (i + 1) * p.N * (p.N - 1) / 2) },
  ],
  random: () => { const N = 8 + Math.floor(Math.random() * 10), a1 = 3 + Math.floor(Math.random() * 12), d = 1 + Math.floor(Math.random() * 5); return { N, a1, S: N * a1 + d * N * (N - 1) / 2 }; },
  compute(p) {
    const d = 2 * (p.S - p.N * p.a1) / (p.N * (p.N - 1));
    return { d, day: k => p.a1 + (k - 1) * d, sum: k => k * (2 * p.a1 + (k - 1) * d) / 2, ask: p.a1 + (ASK - 1) * d };
  },
  duration: p => p.N,

  problem: (p, m, v) => `Вера надписывает открытки к Новому году. В первый день она надписала ${v('a1')} ${Lab.plural(p.a1, 'открытку', 'открытки', 'открыток')}, а в каждый следующий день — на одно и то же количество открыток больше, чем в предыдущий. Известно, что за ${v('N')} ${Lab.plural(p.N, 'день', 'дня', 'дней')} Вера надписала ${v('S')} ${Lab.plural(p.S, 'открытку', 'открытки', 'открыток')}.
    <span class="q">Сколько открыток Вера надписала за четвёртый день?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Открытки по дням — арифметическая прогрессия', f: F(`a_1 = ${p.a1},\\quad n = ${p.N},\\quad S_{${p.N}} = ${p.S}`), always: true },
      { t: 'Из формулы суммы найдём разность', f: F('S_n = \\frac{2a_1 + (n - 1)d}{2}*n'), c: F(`${p.S} = \\frac{${2 * p.a1} + ${p.N - 1}d}{2}*${p.N} \\Rightarrow d = \\hl{${fmt(m.d)}}`) },
      { t: 'Четвёртый день', f: F('a_4 = a_1 + 3d'), c: F(`a_4 = ${p.a1} + 3*${fmt(m.d)} = \\ans{${fmt(m.ask)}}`), final: true },
    ],
    answer: `${fmt(m.ask)} ${Lab.plural(m.ask, 'открытка', 'открытки', 'открыток')}`,
  }),

  terms: (p, m) => ({
    items: Array.from({ length: p.N }, (_, i) => ({ i: `${i + 1} д.`, x: fmt(m.day(i + 1)), star: i === ASK - 1 })),
    sum: t => `Надписано <b>${fmt(m.sum(Math.min(Math.floor(t), p.N)))}</b> из ${p.S}`,
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    return [
      { k: 'День', v: String(k), u: `из ${p.N}` },
      { k: 'Надписано', v: fmt(Math.floor(cardsDone(p, m, t)), 0), u: `из ${p.S}`, tone: 'acc' },
      { k: 'Сегодня', v: k ? fmt(Math.floor(cardsDone(p, m, t) - m.sum(k - 1) + 1e-9), 0) : '—' },
    ];
  },
  doneText: (p, m) => `В четвёртый день Вера надписала ${fmt(m.ask)} открыток`,
  about: `<p class="lead">Классическая задача ЕГЭ: известны первый член, количество членов и сумма — нужно найти член из середины.</p>
    <p>Сначала из формулы суммы <span class="m">S<sub><i>n</i></sub> = (2a<sub>1</sub> + (<i>n</i> − 1)<i>d</i>)·<i>n</i>/2</span> находим разность, потом — нужный член. Стопки открыток на рисунке растут «лесенкой»: каждая следующая выше на одно и то же число открыток.</p>` + Lab.THEORY.ap,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    // деревянный стол
    ctx.fillStyle = dark ? '#21180f' : '#e9cfa8'; ctx.fillRect(0, 0, w, h);
    for (let y = 0, i = 0; y < h; y += 46, i++) {
      ctx.fillStyle = i % 2 ? (dark ? '#251b11' : '#e3c79e') : (dark ? '#21180f' : '#ecd4b0');
      ctx.fillRect(0, y, w, 46);
      for (let x = (i * 53) % 90; x < w; x += 90) {
        ctx.beginPath(); ctx.ellipse(x, y + 23, 24, 3, 0, 0, Math.PI * 2);
        ctx.strokeStyle = dark ? 'rgba(255,255,255,.03)' : 'rgba(120,70,20,.08)'; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    const top = 100, base = h - 44;
    const colW = (w - 60) / p.N;
    const maxC = m.day(p.N);
    const th = Math.max(1.5, Math.min(9, (base - top - 24) / maxC));
    const cardW = Math.min(colW * .78, 64), cardH = cardW * .62;
    const pal = dark ? ['#7a3b4f', '#3f5f8a', '#4f7a4a', '#8a6a2f', '#5f4a8a', '#2f7a78'] : ['#ffc9d6', '#bde0fe', '#c7f0bd', '#ffe3a3', '#e0c3fc', '#b8f2e6'];
    const done = cardsDone(p, m, t);
    let acc = 0;
    for (let d = 1; d <= p.N; d++) {
      const cnt = Math.round(m.day(d));
      const cx = 30 + (d - .5) * colW;
      const shown = D.clamp(done - acc, 0, cnt);
      const rnd = D.rand(d * 97);
      for (let i = 0; i < Math.ceil(shown); i++) {
        const y = base - (i + 1) * th;
        const jx = (rnd() - .5) * 4, rot = (rnd() - .5) * .06;
        const fresh = i === Math.ceil(shown) - 1 ? shown - i : 1;
        const dropY = (1 - D.ease.out(fresh)) * -60;
        ctx.save();
        ctx.translate(cx + jx, y + dropY);
        ctx.rotate(rot);
        ctx.globalAlpha = Math.min(1, fresh * 1.5);
        D.rr(ctx, -cardW / 2, -th / 2, cardW, Math.max(th - .6, 1.2), 1.5);
        ctx.fillStyle = pal[(i + d) % pal.length]; ctx.fill();
        ctx.restore();
      }
      // верхняя открытка лицом вверх
      if (shown >= 1) {
        const y = base - Math.ceil(shown) * th - cardH * .1;
        ctx.save();
        ctx.translate(cx, y);
        D.shadow(ctx, 6, 'rgba(0,0,0,.2)', 2);
        D.rr(ctx, -cardW / 2, -cardH + th, cardW, cardH * .55, 4);
        ctx.fillStyle = dark ? '#3a3f4f' : '#fff'; ctx.fill();
        D.noShadow(ctx);
        if (cardW > 26) {
          ctx.fillStyle = d === ASK ? C.amber : C.acc;
          const hx = -cardW / 2 + cardW * .2, hy = -cardH * .72 + th;
          ctx.beginPath(); ctx.arc(hx - 2.5, hy, 3, Math.PI, 0); ctx.arc(hx + 2.5, hy, 3, Math.PI, 0); ctx.lineTo(hx, hy + 6); ctx.closePath(); ctx.fill();
          D.line(ctx, hx + 8, hy - 1, cardW / 2 - 6, hy - 1, C.ink3, 1);
          D.line(ctx, hx + 8, hy + 4, cardW / 2 - 12, hy + 4, C.ink3, 1);
        }
        ctx.restore();
      }
      const labelY = base - Math.ceil(shown) * th - cardH * .75;
      if (shown >= cnt - 1e-9 && cnt > 0) D.pill(ctx, fmt(cnt), cx, labelY - 10, { bg: d === ASK ? C.amber : (dark ? '#2b2f3d' : '#fff'), color: d === ASK ? '#1c1a21' : C.ink, size: Math.min(12, colW * .32), shadow: true });
      else if (d === ASK && shown === 0) D.pill(ctx, '?', cx, base - 30, { bg: C.amber, color: '#1c1a21', size: 12 });
      D.text(ctx, String(d), cx, base + 16, { size: Math.min(12, colW * .4), weight: 700, color: d === ASK ? (dark ? '#ffd43b' : '#b26b00') : C.ink3 });
      acc += cnt;
    }
    D.text(ctx, 'день', 26, base + 16, { size: 11, align: 'right', color: C.ink3 });
    if (t >= p.N) {
      // «лесенка»: прямая через вершины стопок
      const x0 = 30 + .5 * colW, x1 = 30 + (p.N - .5) * colW;
      const y0 = base - p.a1 * th - cardH * .75 - 24, y1 = base - m.day(p.N) * th - cardH * .75 - 24;
      D.line(ctx, x0, y0, x1, y1, D.alpha(C.acc, .55), 2, [6, 5]);
      D.pill(ctx, `каждый день +${fmt(m.d)}`, (x0 + x1) / 2 - 40, (y0 + y1) / 2 - 18, { bg: C.acc, color: '#fff', size: 12, shadow: true });
    }
  },
});

function cardsDone(p, m, t) {
  const k = Math.min(Math.floor(t), p.N);
  if (k >= p.N) return p.S;
  return m.sum(k) + m.day(k + 1) * D.clamp((t - k) / .85, 0, 1);
}
</script>
</body>
</html>
