<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задачи Васи — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;

Lab.model({
  id: 'vasya',
  unit: 'День',
  rate: p => Math.max(.7, p.N / 14),
  params: [
    { key: 'N', sym: 'n', label: 'дней', min: 5, max: 20, value: 14 },
    { key: 'a1', sym: 'a_1', label: 'в первый день', min: 1, max: 20, value: 5 },
    { key: 'S', sym: 'S', label: 'всего задач', value: 434, keepIndex: true,
      values: p => Array.from({ length: 8 }, (_, i) => p.N * p.a1 + (i + 1) * p.N * (p.N - 1) / 2) },
  ],
  random: () => { const N = 6 + Math.floor(Math.random() * 10), a1 = 2 + Math.floor(Math.random() * 10), d = 1 + Math.floor(Math.random() * 5); return { N, a1, S: N * a1 + d * N * (N - 1) / 2 }; },
  compute(p) {
    const an = 2 * p.S / p.N - p.a1, d = (an - p.a1) / (p.N - 1);
    return { an, d, day: k => p.a1 + (k - 1) * d, sum: k => k * (2 * p.a1 + (k - 1) * d) / 2 };
  },
  duration: p => p.N,

  problem: (p, m, v) => `Васе надо решить ${v('S')} ${Lab.plural(p.S, 'задачу', 'задачи', 'задач')}. Ежедневно он решает на одно и то же количество задач больше, чем в предыдущий день. За первый день Вася решил ${v('a1')} ${Lab.plural(p.a1, 'задачу', 'задачи', 'задач')}.
    <span class="q">Сколько задач Вася решил в последний день, если со всеми задачами он справился за ${v('N')} ${Lab.plural(p.N, 'день', 'дня', 'дней')}?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Задачи по дням — арифметическая прогрессия', f: F(`a_1 = ${p.a1},\\quad n = ${p.N},\\quad S_{${p.N}} = ${p.S}`), always: true },
      { t: 'Формула суммы через первый и последний члены', f: F('S_n = \\frac{a_1 + a_n}{2}*n \\Rightarrow a_n = \\frac{2S_n}{n} - a_1') },
      { t: 'Последний день', c: F(`a_{${p.N}} = \\frac{2*${p.S}}{${p.N}} - ${p.a1} = ${fmt(2 * p.S / p.N)} - ${p.a1} = \\ans{${fmt(m.an)}}`), final: true },
    ],
    answer: `${fmt(m.an)} ${Lab.plural(m.an, 'задача', 'задачи', 'задач')}`,
  }),

  terms: (p, m) => ({
    items: Array.from({ length: p.N }, (_, i) => ({ i: `${i + 1} д.`, x: fmt(m.day(i + 1)), star: i === p.N - 1 })),
    sum: t => `Решено <b>${fmt(m.sum(Math.min(Math.floor(t), p.N)))}</b> из ${p.S}`,
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    return [
      { k: 'День', v: String(k), u: `из ${p.N}` },
      { k: 'Решено', v: fmt(Math.floor(solved(p, m, t)), 0), u: `из ${p.S}`, tone: 'acc' },
      { k: 'Сегодня', v: k ? fmt(Math.floor(solved(p, m, t) - m.sum(k - 1) + 1e-9), 0) : '—' },
    ];
  },
  doneText: (p, m) => `В последний день Вася решил ${fmt(m.an)} задач`,
  about: `<p class="lead">Здесь неизвестен последний член, но его не нужно искать через разность — есть короткий путь.</p>
    <p>Формула <span class="m">S<sub><i>n</i></sub> = (a<sub>1</sub> + a<sub><i>n</i></sub>)·<i>n</i>/2</span> связывает сумму с первым и последним членами напрямую:</p>
    <div class="box">a<sub>n</sub> = 2S<sub>n</sub>/n − a<sub>1</sub></div>
    <p>На доске каждая клетка — одна задача. Видно, как «лесенка» дней складывается в трапецию: её площадь и есть формула суммы.</p>` + Lab.THEORY.ap,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    // школьная доска / тетрадный лист
    ctx.fillStyle = dark ? '#173027' : '#fbfaf6'; ctx.fillRect(0, 0, w, h);
    if (!dark) {
      for (let y = 0; y < h; y += 22) D.line(ctx, 0, y, w, y, 'rgba(47,125,225,.12)', 1);
      D.line(ctx, 46, 0, 46, h, 'rgba(224,49,49,.3)', 1.5);
    } else {
      const g = ctx.createRadialGradient(w / 2, h / 2, 50, w / 2, h / 2, Math.max(w, h));
      g.addColorStop(0, 'rgba(255,255,255,.04)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }
    const top = 96, base = h - 40;
    const colW = (w - 80) / p.N;
    const per = 3;
    const maxRows = Math.ceil(m.an / per);
    const cell = Math.max(3, Math.min(colW / (per + .9), (base - top - 30) / maxRows, 20));
    const done = solved(p, m, t);
    let acc = 0;
    const ink = dark ? '#e9f5ee' : C.ink;
    for (let d = 1; d <= p.N; d++) {
      const cnt = Math.round(m.day(d));
      const cx = 60 + (d - .5) * colW;
      const x0 = cx - per * cell / 2;
      const shown = D.clamp(done - acc, 0, cnt);
      for (let i = 0; i < cnt; i++) {
        const r = Math.floor(i / per), c = i % per;
        const x = x0 + c * cell, y = base - (r + 1) * cell;
        const fill = D.clamp(shown - i, 0, 1);
        D.rr(ctx, x + 1, y + 1, cell - 2, cell - 2, Math.min(4, cell * .25));
        if (fill <= 0) {
          ctx.strokeStyle = dark ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.08)'; ctx.lineWidth = 1; ctx.stroke();
          continue;
        }
        ctx.fillStyle = d === p.N ? C.amber : D.mix(C.violet, C.blue, (d - 1) / Math.max(1, p.N - 1));
        ctx.globalAlpha = .35 + .65 * fill;
        ctx.fill();
        ctx.globalAlpha = 1;
        if (cell > 9 && fill >= 1) {
          ctx.beginPath();
          ctx.moveTo(x + cell * .28, y + cell * .52); ctx.lineTo(x + cell * .44, y + cell * .68); ctx.lineTo(x + cell * .74, y + cell * .34);
          ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = Math.max(1.2, cell * .1); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
        }
      }
      const rows = Math.ceil(cnt / per);
      if (shown >= cnt - 1e-9) D.text(ctx, fmt(cnt), cx, base - rows * cell - 12, { size: Math.min(13, colW * .34), weight: 800, color: d === p.N ? (dark ? '#ffd43b' : '#b26b00') : ink });
      else if (d === p.N) D.pill(ctx, '?', cx, base - 18, { bg: C.amber, color: '#1c1a21', size: 12 });
      D.text(ctx, String(d), cx, base + 15, { size: Math.min(12, colW * .4), weight: 700, color: dark ? 'rgba(233,245,238,.6)' : C.ink3 });
      acc += cnt;
    }
    // полоса прогресса «до 434»
    const bx = 60, bw = w - 120, by = 82;
    if (w > 500) {
      D.rr(ctx, bx, by, bw, 8, 4); ctx.fillStyle = dark ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.07)'; ctx.fill();
      D.rr(ctx, bx, by, bw * done / p.S, 8, 4); ctx.fillStyle = C.acc; ctx.fill();
    }
    if (t >= p.N) {
      // трапеция: «площадь» = сумма
      const xa = 60 + .5 * colW - per * cell / 2, xb = 60 + (p.N - .5) * colW + per * cell / 2;
      const ya = base - Math.ceil(p.a1 / per) * cell, yb = base - Math.ceil(m.an / per) * cell;
      ctx.beginPath(); ctx.moveTo(xa, base); ctx.lineTo(xa, ya); ctx.lineTo(xb, yb); ctx.lineTo(xb, base); ctx.closePath();
      ctx.strokeStyle = D.alpha(C.acc, .7); ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);
      D.pill(ctx, `(${p.a1} + ${fmt(m.an)}) · ${p.N} / 2 = ${p.S}`, (xa + xb) / 2, (ya + yb) / 2 - 30, { bg: C.acc, color: '#fff', size: 13, shadow: true, h: 28 });
    }
  },
});

function solved(p, m, t) {
  const k = Math.min(Math.floor(t), p.N);
  if (k >= p.N) return p.S;
  return m.sum(k) + m.day(k + 1) * D.clamp((t - k) / .85, 0, 1);
}
</script>
</body>
</html>
