<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Змейка на клетчатой бумаге — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
// звенья 1, 1, 2, 2, 3, 3, … закручиваются в квадратную спираль: →, ↑, ←, ↓, →, …
const DIRS = [[1, 0], [0, -1], [-1, 0], [0, 1]];
function segments(n) {
  const out = [];
  let x = 0, y = 0;
  for (let j = 0; j < 2 * n; j++) {
    const len = Math.floor(j / 2) + 1, [dx, dy] = DIRS[j % 4];
    out.push({ x0: x, y0: y, x1: x + dx * len, y1: y + dy * len, len, pair: len });
    x += dx * len; y += dy * len;
  }
  return out;
}

Lab.model({
  id: 'snake',
  unit: 'Пара',
  rate: p => Math.max(1, p.n / 10),
  params: [
    { key: 'n', sym: 'n', label: 'длина последнего звена', min: 1, max: 120, value: 10, unit: 'кл.' },
  ],
  compute: p => {
    const segs = segments(p.n);
    let xs = [0], ys = [0];
    segs.forEach(s => { xs.push(s.x1); ys.push(s.y1); });
    return { segs, S: p.n * (p.n + 1), minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
  },
  duration: p => p.n,

  problem: (p, m, v) => `На клетчатой бумаге нарисована ломаная-«змейка». Её звенья идут по линиям сетки парами одинаковой длины: 1, 1, 2, 2, 3, 3, … клетки.
    <span class="q">Найдите длину ломаной, если последнее звено имеет длину ${v('n')}.</span>`,
  problemNote: () => 'В варианте ОГЭ последнее звено равно 120 — поставьте n = 120 и проверьте свой ответ.',

  solution: (p, m) => ({
    steps: [
      { t: 'Сгруппируем звенья парами', f: F('(1 + 1) + (2 + 2) + \\ldots + (n + n)'), always: true },
      { t: 'Суммы пар 2, 4, 6, … — арифметическая прогрессия', f: F('a_1 = 2,\\quad d = 2,\\quad a_n = 2n'), always: true },
      { t: 'Сумма n пар', f: F('S = \\frac{2 + 2n}{2}*n = n(n + 1)'), c: F(`S = ${p.n}*${p.n + 1} = \\ans{${fmt(m.S)}}`), final: true },
    ],
    answer: `${fmt(m.S)} ${Lab.plural(m.S, 'клетка', 'клетки', 'клеток')}`,
  }),

  terms: p => ({
    items: Array.from({ length: p.n }, (_, i) => ({ i: `${i + 1}+${i + 1}`, x: 2 * (i + 1) })),
    max: 30,
    sum: t => { const k = Math.min(Math.floor(t), p.n); return k ? F(`S_{${k}} = ${k}*${k + 1} = ${fmt(k * (k + 1))}`) : 'Каждая пара звеньев — один член прогрессии 2, 4, 6, …'; },
  }),

  hud: (p, m, t) => {
    const len = drawnLength(p, t);
    const k = Math.min(Math.ceil(t - 1e-9), p.n);
    return [
      { k: 'Пара', v: String(k), u: `из ${p.n}` },
      { k: 'Звеньев', v: String(Math.min(2 * p.n, Math.ceil(segIndex(p, t)))) },
      { k: 'Длина', v: fmt(len, 0), u: 'кл.', tone: 'acc' },
    ];
  },
  doneText: (p, m) => `Длина ломаной: ${p.n} · ${p.n + 1} = ${fmt(m.S)} клеток`,
  about: `<p class="lead">Когда звенья идут парами 1, 1, 2, 2, 3, 3, …, ломаная сама закручивается в квадратную спираль.</p>
    <p>Удобнее всего складывать не по одному звену, а парами: (1 + 1) + (2 + 2) + … + (n + n). Получается прогрессия 2, 4, 6, …, 2n — её сумма равна <span class="m"><i>n</i>(<i>n</i> + 1)</span>.</p>
    <p>Можно и иначе: удвоить сумму 1 + 2 + … + n, которая равна <span class="m"><i>n</i>(<i>n</i> + 1)/2</span>. Это так называемые треугольные числа.</p>` + Lab.THEORY.ap,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    ctx.fillStyle = dark ? '#10172a' : '#fbfdff'; ctx.fillRect(0, 0, w, h);
    const spanX = m.maxX - m.minX + 2, spanY = m.maxY - m.minY + 2;
    const top = 80;
    const cell = Math.max(3, Math.min(48, (w - 40) / spanX, (h - top - 24) / spanY));
    const ox = (w - (spanX - 2) * cell) / 2 - m.minX * cell;
    const oy = top + ((h - top - 12) - (spanY - 2) * cell) / 2 - m.minY * cell;
    // сетка
    const gx0 = ((ox % cell) + cell) % cell, gy0 = ((oy % cell) + cell) % cell;
    ctx.lineWidth = 1;
    for (let x = gx0; x < w; x += cell) D.line(ctx, x, 0, x, h, dark ? 'rgba(120,160,255,.10)' : 'rgba(47,125,225,.13)', 1);
    for (let y = gy0; y < h; y += cell) D.line(ctx, 0, y, w, y, dark ? 'rgba(120,160,255,.10)' : 'rgba(47,125,225,.13)', 1);
    // поля тетради
    D.line(ctx, Math.min(60, w * .06), 0, Math.min(60, w * .06), h, dark ? 'rgba(255,107,107,.25)' : 'rgba(224,49,49,.35)', 1.5);

    const P = (x, y) => [ox + x * cell, oy + y * cell];
    const idx = segIndex(p, t);
    const full = Math.floor(idx), frac = idx - full;
    const lw = Math.max(1.6, Math.min(5, cell * .22));
    const cols = [C.acc, C.blue];
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let j = 0; j < Math.min(full + 1, m.segs.length); j++) {
      const sg = m.segs[j];
      const f = j < full ? 1 : frac;
      if (f <= 0) continue;
      const [x0, y0] = P(sg.x0, sg.y0);
      const [x1, y1] = P(sg.x0 + (sg.x1 - sg.x0) * f, sg.y0 + (sg.y1 - sg.y0) * f);
      ctx.strokeStyle = cols[(sg.pair - 1) % 2];
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      // подписи длин
      if (cell * sg.len >= 22 && cell >= 12 && j < full) {
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        const off = cell * .42;
        const [dx, dy] = DIRS[j % 4];
        D.text(ctx, String(sg.len), mx + dy * off, my - dx * off, { size: Math.min(13, cell * .45), weight: 700, color: cols[(sg.pair - 1) % 2] });
      }
    }
    // начало и «карандаш»
    const [sx, sy] = P(0, 0);
    D.circle(ctx, sx, sy, lw * 1.4, C.ink);
    let tip = [sx, sy];
    if (full < m.segs.length) {
      const sg = m.segs[full];
      tip = P(sg.x0 + (sg.x1 - sg.x0) * frac, sg.y0 + (sg.y1 - sg.y0) * frac);
    } else { const sg = m.segs[m.segs.length - 1]; tip = P(sg.x1, sg.y1); }
    if (t > 0) {
      D.glow(ctx, tip[0], tip[1], lw * 6, C.acc, .45 + .15 * Math.sin(time * 6));
      D.circle(ctx, tip[0], tip[1], lw * 1.3, '#fff', C.acc, 2);
    } else {
      D.text(ctx, 'Нажмите ▶ — карандаш начнёт рисовать змейку', w / 2, top - 30, { size: 14, color: C.ink3 });
    }
  },
});

// индекс текущего звена (дробный): за единицу времени рисуется одна пара,
// внутри пары скорость пропорциональна длине звена
function segIndex(p, t) {
  const k = Math.floor(t), f = t - k;
  if (k >= p.n) return 2 * p.n;
  return 2 * k + Math.min(2, f * 2);
}
function drawnLength(p, t) {
  const idx = segIndex(p, t), full = Math.floor(idx);
  let len = 0;
  for (let j = 0; j < full; j++) len += Math.floor(j / 2) + 1;
  if (full < 2 * p.n) len += (Math.floor(full / 2) + 1) * (idx - full);
  return len;
}
</script>
</body>
</html>
