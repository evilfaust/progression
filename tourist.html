<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Турист между городами — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const ASK = 3; // спрашивают про третий день

Lab.model({
  id: 'tourist',
  unit: 'День',
  rate: .65,
  params: [
    { key: 'N', sym: 'n', label: 'дней в пути', min: 3, max: 12, value: 6 },
    { key: 'a1', sym: 'a_1', label: 'в первый день', min: 3, max: 25, value: 10, unit: 'км' },
    { key: 'S', sym: 'S', label: 'расстояние между городами', value: 120, unit: 'км', keepIndex: true,
      values: p => Array.from({ length: 12 }, (_, i) => p.N * p.a1 + (i + 1) * p.N * (p.N - 1) / 2) },
  ],
  random: () => { const N = 4 + Math.floor(Math.random() * 6), a1 = 5 + Math.floor(Math.random() * 15), d = 1 + Math.floor(Math.random() * 6); return { N, a1, S: N * a1 + d * N * (N - 1) / 2 }; },
  compute(p) {
    const d = 2 * (p.S - p.N * p.a1) / (p.N * (p.N - 1));
    return { d, day: k => p.a1 + (k - 1) * d, sum: k => k * (2 * p.a1 + (k - 1) * d) / 2, ask: p.a1 + (ASK - 1) * d };
  },
  duration: p => p.N,

  problem: (p, m, v) => `Турист идёт из одного города в другой, каждый день проходя больше, чем в предыдущий, на одно и то же расстояние. За первый день турист прошёл ${v('a1')}&nbsp;км.
    <span class="q">Сколько километров турист прошёл за третий день, если весь путь он прошёл за ${v('N')} ${Lab.plural(p.N, 'день', 'дня', 'дней')}, а расстояние между городами составляет ${v('S')}&nbsp;км?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: 'Километры по дням — арифметическая прогрессия', f: F(`a_1 = ${p.a1},\\quad n = ${p.N},\\quad S_{${p.N}} = ${p.S}`), always: true },
      { t: 'Из формулы суммы найдём разность', f: F('S_n = \\frac{2a_1 + (n - 1)d}{2}*n'), c: F(`${p.S} = \\frac{${2 * p.a1} + ${p.N - 1}d}{2}*${p.N} \\Rightarrow d = \\hl{${fmt(m.d)}}`) },
      { t: 'Третий день', f: F('a_3 = a_1 + 2d'), c: F(`a_3 = ${p.a1} + 2*${fmt(m.d)} = \\ans{${fmt(m.ask)}}`), final: true },
    ],
    answer: `${fmt(m.ask)} км`,
  }),

  terms: (p, m) => ({
    items: Array.from({ length: p.N }, (_, i) => ({ i: `${i + 1} д.`, x: fmt(m.day(i + 1)), star: i === ASK - 1 })),
    sum: t => `Пройдено <b>${fmt(m.sum(Math.min(Math.floor(t), p.N)))}</b> из ${p.S} км`,
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    return [
      { k: 'День', v: String(k), u: `из ${p.N}` },
      { k: 'Пройдено', v: fmt(walked(p, m, t), 0), u: 'км', tone: 'acc' },
      { k: 'Сегодня', v: k ? fmt(walked(p, m, t) - m.sum(k - 1), 1) : '—', u: k ? 'км' : '' },
    ];
  },
  doneText: (p, m) => `На третий день турист прошёл ${fmt(m.ask)} км`,
  about: `<p class="lead">Здесь неизвестна разность прогрессии, а известны первый член, число членов и сумма.</p>
    <p>Используем вторую форму формулы суммы — через <span class="m">a<sub>1</sub></span> и <i>d</i>:</p>
    <div class="box">S<sub>n</sub> = (2a<sub>1</sub> + (n − 1)d)·n / 2</div>
    <p>В ней одно неизвестное — <i>d</i>. Найдя его, получаем любой день пути. На карте искомый третий день подсвечен.</p>` + Lab.THEORY.ap,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    // бумажная карта
    ctx.fillStyle = dark ? '#151b22' : '#f4ecd8'; ctx.fillRect(0, 0, w, h);
    const rnd = D.rand(31);
    // изолинии
    for (let c = 0; c < 3; c++) {
      const hx = w * (.2 + .3 * c + rnd() * .1), hy = h * (.35 + rnd() * .4);
      for (let r = 20; r < 130; r += 18) {
        ctx.beginPath();
        for (let a = 0; a <= Math.PI * 2 + .1; a += .2) { const rr = r * (1 + .18 * Math.sin(a * 3 + c)); const x = hx + Math.cos(a) * rr * 1.5, y = hy + Math.sin(a) * rr; a ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.strokeStyle = dark ? 'rgba(140,170,140,.10)' : 'rgba(150,110,60,.14)'; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    // река
    ctx.beginPath(); ctx.moveTo(w * .62, 0);
    ctx.bezierCurveTo(w * .5, h * .3, w * .78, h * .55, w * .6, h);
    ctx.strokeStyle = dark ? '#1f4466' : '#9fcdf0'; ctx.lineWidth = 12; ctx.stroke();
    ctx.strokeStyle = dark ? '#2b5a85' : '#bfe0f7'; ctx.lineWidth = 4; ctx.stroke();
    // лесочки
    for (let i = 0; i < 26; i++) {
      const x = rnd() * w, y = 90 + rnd() * (h - 120);
      D.circle(ctx, x, y, 6 + rnd() * 5, dark ? 'rgba(80,140,90,.35)' : 'rgba(80,150,80,.35)');
    }

    // маршрут: гладкая кривая от A к B
    const A = [Math.max(70, w * .09), h * .7], B = [w - Math.max(70, w * .09), h * .34];
    const c1 = [w * .35, h * .2], c2 = [w * .55, h * .95];
    const pts = [];
    for (let i = 0; i <= 200; i++) {
      const u = i / 200, v = 1 - u;
      pts.push([v * v * v * A[0] + 3 * v * v * u * c1[0] + 3 * v * u * u * c2[0] + u * u * u * B[0], v * v * v * A[1] + 3 * v * v * u * c1[1] + 3 * v * u * u * c2[1] + u * u * u * B[1]]);
    }
    const acc = [0];
    for (let i = 1; i < pts.length; i++) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const L = acc[acc.length - 1];
    const at = frac => {
      const target = frac * L;
      let i = 1; while (i < acc.length - 1 && acc[i] < target) i++;
      const u = (target - acc[i - 1]) / Math.max(1e-9, acc[i] - acc[i - 1]);
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * u, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * u];
    };
    const path = (f0, f1, col, lw, dash) => {
      ctx.beginPath();
      const steps = Math.max(2, Math.ceil((f1 - f0) * 120));
      for (let i = 0; i <= steps; i++) { const [x, y] = at(f0 + (f1 - f0) * i / steps); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
    };
    path(0, 1, dark ? 'rgba(220,200,160,.35)' : 'rgba(120,80,40,.45)', 3, [2, 7]);
    // искомый день — подсветка
    const fa = m.sum(ASK - 1) / p.S, fb = m.sum(ASK) / p.S;
    path(fa, fb, D.alpha(C.amber, .35), 16);
    const done = Math.min(Math.floor(t + 1e-9), p.N);
    const pos = walked(p, m, t) / p.S;
    const palette = [C.acc, C.violet];
    for (let d = 1; d <= Math.min(Math.ceil(t - 1e-9), p.N); d++) {
      const f0 = m.sum(d - 1) / p.S, f1 = Math.min(pos, m.sum(d) / p.S);
      path(f0, f1, d === ASK ? C.amber : palette[d % 2], 5);
    }
    // стоянки
    for (let d = 1; d <= done && d < p.N; d++) {
      const [x, y] = at(m.sum(d) / p.S);
      drawTent(ctx, x, y, C, d === ASK);
      D.text(ctx, String(d), x, y + 14, { size: 10.5, weight: 800, color: C.ink2 });
    }
    // подписи километров у сегментов
    for (let d = 1; d <= done; d++) {
      const [x, y] = at((m.sum(d - 1) + m.day(d) / 2) / p.S);
      D.pill(ctx, `${fmt(m.day(d))} км`, x, y - 18, { bg: d === ASK ? C.amber : (dark ? '#232a35' : '#fffaf0'), color: d === ASK ? '#1c1a21' : C.ink, size: 11, shadow: true });
    }
    if (done < ASK) {
      const [x, y] = at((fa + fb) / 2);
      D.pill(ctx, '3-й день — ?', x, y + 26, { bg: C.amber, color: '#1c1a21', size: 11.5 });
    }
    drawCity(ctx, A[0], A[1], 'Город А', C);
    drawCity(ctx, B[0], B[1], 'Город Б', C);
    // турист
    const [hx, hy] = at(pos);
    const bob = s.playing && t < p.N ? Math.abs(Math.sin(time * 8)) * 3 : 0;
    D.glow(ctx, hx, hy, 26, C.acc, .3);
    D.circle(ctx, hx, hy - 6 - bob, 9, C.acc, '#fff', 2.5);
    D.circle(ctx, hx, hy - 9 - bob, 3, '#fff');
    D.line(ctx, hx, hy - 6 - bob, hx, hy - bob, '#fff', 2);
    // компас и масштаб
    D.dim(ctx, 30, h - 22, Math.min(w - 30, 30 + 140), h - 22, `${fmt(p.S * 140 / L, 0)} км`, { color: C.ink3, bg: C.surface, labelColor: C.ink2, size: 10.5 });
  },
});

function walked(p, m, t) {
  const k = Math.min(Math.floor(t), p.N);
  if (k >= p.N) return p.S;
  return m.sum(k) + m.day(k + 1) * D.ease.inOut(D.clamp((t - k) / .85, 0, 1));
}
function drawTent(ctx, x, y, C, hl) {
  ctx.beginPath(); ctx.moveTo(x - 9, y + 3); ctx.lineTo(x, y - 11); ctx.lineTo(x + 9, y + 3); ctx.closePath();
  ctx.fillStyle = hl ? C.amber : C.orange; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x, y - 11); ctx.lineTo(x - 2, y + 3); ctx.lineTo(x + 2, y + 3); ctx.closePath();
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();
}
function drawCity(ctx, x, y, name, C) {
  const dark = C.dark;
  const hs = [20, 32, 26, 38, 22];
  hs.forEach((hh, i) => {
    const bx = x - 30 + i * 12;
    D.rr(ctx, bx, y - hh, 11, hh, 2); ctx.fillStyle = dark ? '#3a4560' : '#b9a68a'; ctx.fill();
    for (let wy = y - hh + 4; wy < y - 4; wy += 7) { ctx.fillStyle = dark ? 'rgba(255,214,102,.8)' : 'rgba(255,255,255,.7)'; ctx.fillRect(bx + 3, wy, 5, 3); }
  });
  D.pill(ctx, name, x, y + 16, { bg: C.ink, color: C.surface, size: 11.5 });
}
</script>
</body>
</html>
