<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прибыль Бубликова — Прогрессии</title>
<link rel="stylesheet" href="assets/lab.css">
</head>
<body>
<script src="assets/catalog.js"></script>
<script src="assets/lab.js"></script>
<script>
const { F, fmt, D } = Lab;
const profit = (p, m, k) => p.a1 * Math.pow(m.q, k - 1);
const ORD_ACC = ['', 'первый', 'второй', 'третий', 'четвёртый', 'пятый', 'шестой', 'седьмой'];

Lab.model({
  id: 'bubbly',
  unit: 'Год',
  rate: .6,
  params: [
    { key: 'a1', sym: 'b_1', label: 'прибыль в первый год', min: 500, max: 10000, step: 500, value: 5000, unit: '₽' },
    { key: 'pct', sym: 'p', label: 'рост за год', min: 50, max: 500, step: 50, value: 300, unit: '%' },
    { key: 'N', sym: 'n', label: 'какой год', min: 2, max: 7, value: 4 },
  ],
  random: () => ({ a1: 500 * (1 + Math.floor(Math.random() * 16)), pct: 100 * (1 + Math.floor(Math.random() * 4)), N: 3 + Math.floor(Math.random() * 3) }),
  compute: p => { const q = 1 + p.pct / 100; return { q, bn: p.a1 * Math.pow(q, p.N - 1) }; },
  duration: p => p.N,

  problem: (p, m, v) => `Прибыль предпринимателя Бубликова каждый год увеличивается на ${v('pct')}% по сравнению с предыдущим годом. В первый год работы прибыль составила ${v('a1')}&nbsp;₽.
    <span class="q">Какой будет прибыль Бубликова в ${v('N', ORD_ACC[p.N])} год?</span>`,

  solution: (p, m) => ({
    steps: [
      { t: `Рост «на ${p.pct}%» — это умножение, а не прибавка`, f: F('q = 1 + \\frac{p}{100}'), c: F(`q = 1 + \\frac{${p.pct}}{100} = \\hl{${fmt(m.q)}}`) },
      { t: 'Прибыль по годам — геометрическая прогрессия', f: F(`b_1 = ${fmt(p.a1)},\\quad q = ${fmt(m.q)}`), always: true },
      { t: `${ORD_ACC[p.N][0].toUpperCase() + ORD_ACC[p.N].slice(1)} год`, f: F('b_n = b_1*q^{n-1}'), c: F(`b_{${p.N}} = ${fmt(p.a1)}*${fmt(m.q)}^{${p.N - 1}} = \\ans{${fmt(m.bn)}}`), final: true },
    ],
    answer: `${fmt(m.bn)} ₽`,
  }),

  terms: (p, m) => ({
    items: Array.from({ length: p.N }, (_, i) => ({ i: `${i + 1} год`, x: Lab.short(profit(p, m, i + 1)), star: i === p.N - 1 })),
    sum: () => `Каждый год прибыль умножается на ${F(`q = ${fmt(m.q)}`)}`,
  }),

  hud: (p, m, t) => {
    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    return [
      { k: 'Год', v: String(k), u: `из ${p.N}` },
      { k: 'Прибыль', v: k ? fmt(profit(p, m, k) * D.ease.out(D.seg(t - (k - 1), 0, .8)), 0) : '—', u: k ? '₽' : '', tone: 'acc' },
      { k: 'Рост к 1-му году', v: k ? `×${fmt(Math.pow(m.q, k - 1))}` : '—' },
    ];
  },
  doneText: (p, m) => `В ${ORD_ACC[p.N]} год прибыль — ${fmt(m.bn)} ₽`,
  about: `<p class="lead">Главная ловушка этой задачи — проценты. «Увеличилась на 300%» значит «стала в 4 раза больше»: к прежним 100% добавили ещё 300%.</p>
    <div class="box">рост на p%  ⇔  умножение на q = 1 + p/100</div>
    <p>Так растут вклады со сложными процентами: каждый год проценты начисляются уже на увеличенную сумму. Обратите внимание, как быстро столбики «улетают» вверх — первые годы на фоне последних почти не видны.</p>` + Lab.THEORY.gp,

  draw(ctx, s) {
    const { w, h, t, p, m, C, time } = s;
    const dark = C.dark;
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, dark ? '#141821' : '#fffaf0'); bg.addColorStop(1, dark ? '#1c1a12' : '#fdf0d5');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    const top = 110, base = h - 46;
    const left = 70, right = w - 30;
    const slot = (right - left) / p.N;
    const bw = Math.min(slot * .56, 120);
    const H = base - top;
    const maxV = m.bn;
    // сетка
    D.ticks(maxV, 4).forEach(v => {
      const y = base - v / maxV * H;
      D.line(ctx, left - 6, y, right, y, D.alpha(C.ink3, .15), 1);
      D.text(ctx, Lab.short(v), left - 10, y, { size: 10.5, align: 'right', color: C.ink3 });
    });
    D.line(ctx, left - 6, base, right, base, C.lineStrong, 2);
    const k = Math.min(Math.ceil(t - 1e-9), p.N);
    const f = k ? t - (k - 1) : 0;
    const coinH = Math.max(3, Math.min(8, H / 60));
    for (let i = 1; i <= p.N; i++) {
      const cx = left + (i - .5) * slot;
      const v = profit(p, m, i);
      const grow = i < k ? 1 : i === k ? D.ease.out(D.seg(f, 0, .8)) : 0;
      const bh = Math.max(i <= k ? 3 : 0, v / maxV * H * grow);
      D.text(ctx, `${i}-й год`, cx, base + 16, { size: 11.5, weight: 700, color: i === p.N ? C.acc : C.ink3 });
      if (grow <= 0) {
        if (i === p.N) D.pill(ctx, '?', cx, base - 18, { bg: C.acc, color: '#fff', size: 13 });
        continue;
      }
      // стопка монет
      const coins = Math.max(1, Math.round(bh / coinH));
      for (let c = 0; c < coins; c++) {
        const y = base - (c + 1) * (bh / coins);
        const jitter = Math.sin(c * 12.9 + i) * 1.5;
        ctx.beginPath(); ctx.ellipse(cx + jitter, y + bh / coins / 2, bw / 2, Math.max(1.5, bh / coins * .9), 0, 0, Math.PI * 2);
        ctx.fillStyle = c % 2 ? (dark ? '#d9a514' : '#f2b705') : (dark ? '#c99510' : '#e6a700');
        ctx.fill();
      }
      const topY = base - bh;
      ctx.beginPath(); ctx.ellipse(cx, topY + 2, bw / 2, Math.max(2, coinH * .9), 0, 0, Math.PI * 2);
      ctx.fillStyle = dark ? '#ffd43b' : '#ffd84d'; ctx.fill();
      ctx.strokeStyle = dark ? '#a37b06' : '#c48f00'; ctx.lineWidth = 1.2; ctx.stroke();
      if (bw > 30) D.text(ctx, '₽', cx, topY + 2, { size: Math.min(12, coinH * 2.4), weight: 800, color: dark ? '#8a6700' : '#a67800' });
      if (grow >= 1 || i === k) D.pill(ctx, `${fmt(v * (i === k ? grow : 1), 0)} ₽`, cx, Math.min(topY - 18, base - 22), { bg: i === p.N && grow >= 1 ? C.good : (dark ? '#2b2f3d' : '#fff'), color: i === p.N && grow >= 1 ? '#fff' : C.ink, size: Math.min(12.5, slot * .16), shadow: true });
      // стрелка ×q к следующему году
      if (i < p.N && (i < k - 1 || (i === k - 1))) {
        const a = D.seg(i === k - 1 ? f : 1, 0, .4);
        if (a > 0) {
          const x0 = cx + bw * .25, x1 = cx + slot - bw * .25;
          const yA = Math.min(topY - 40, base - 60);
          ctx.globalAlpha = a;
          ctx.beginPath(); ctx.moveTo(x0, yA); ctx.quadraticCurveTo((x0 + x1) / 2, yA - 34, x1, yA - 6);
          ctx.strokeStyle = C.acc; ctx.lineWidth = 2; ctx.stroke();
          D.arrow(ctx, x1 - 6, yA - 12, x1, yA - 6, C.acc, 2, 8);
          D.pill(ctx, `×${fmt(m.q)}`, (x0 + x1) / 2, yA - 28, { bg: C.acc, color: '#fff', size: 11.5 });
          ctx.globalAlpha = 1;
        }
      }
    }
    // монетки сыплются в текущий столбик
    if (s.playing && k && f < .85) {
      const cx = left + (k - .5) * slot;
      for (let j = 0; j < 6; j++) {
        const ph = (time * 1.6 + j / 6) % 1;
        const x = cx + Math.sin(j * 2.3) * bw * .3, y = top - 30 + ph * (base - top) * .6;
        ctx.beginPath(); ctx.ellipse(x, y, 7, 3 + Math.abs(Math.sin(time * 6 + j)) * 4, 0, 0, Math.PI * 2);
        ctx.fillStyle = D.alpha(dark ? '#ffd43b' : '#f2b705', 1 - ph); ctx.fill();
      }
    }
  },
});
</script>
</body>
</html>
